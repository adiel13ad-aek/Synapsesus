plugins { id 'com.android.application' }

def appUrl = providers.gradleProperty('APP_URL').orElse('').get().trim().replaceAll('/+$', '')
if (appUrl && !(appUrl ==~ /https:\/\/[A-Za-z0-9.-]+(:[0-9]{1,5})?/)) {
    throw new GradleException('APP_URL deve ser uma origem HTTPS sem caminho, usuário, senha ou parâmetros.')
}
android {
    namespace 'app.synapse.discovery'
    compileSdk 36
    defaultConfig {
        // Escolha um identificador único antes de registrar na Play. Não há garantia de disponibilidade.
        applicationId 'app.synapse.discovery'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '0.4.0'
        buildConfigField 'String', 'APP_URL', '"' + appUrl + '"'
        resValue 'string', 'app_name', 'Synapse'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug {
            applicationIdSuffix '.beta'
            versionNameSuffix '-beta'
            resValue 'string', 'app_name', 'Synapse Beta'
        }
        release {
            minifyEnabled false
            // Assine no Android Studio. Nenhuma chave privada faz parte deste projeto.
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.14.0' }

def requireProductionUrl = tasks.register('requireProductionUrl') {
    doLast {
        if (!appUrl) throw new GradleException('Release bloqueado: configure APP_URL com seu servidor HTTPS. Não publique a demo como rede real.')
    }
}
tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') task.dependsOn(requireProductionUrl)
}
