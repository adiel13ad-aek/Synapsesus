# Optional Render deployment. Starter + persistent disk are PAID resources.
# This template is not permission to subscribe/pay; review prices before creating it.
services:
  - type: web
    name: synapse-discovery
    runtime: docker
    plan: starter
    healthCheckPath: /api/ready
    autoDeployTrigger: "off"
    disk:
      name: synapse-data
      mountPath: /app/data
      sizeGB: 5
    envVars:
      - key: SYNAPSE_ENV
        value: production
      - key: SEED_DEMO_DATA
        value: "0"
      - key: MAIL_MODE
        value: smtp
      - key: SYNAPSE_DB
        value: /app/data/synapse.db
      - key: SYNAPSE_MEDIA
        value: /app/data/media
      - key: PUBLIC_ORIGIN
        sync: false
      - key: OPERATOR_NAME
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: CHILD_SAFETY_EMAIL
        sync: false
      - key: POLICIES_REVIEWED
        sync: false
      - key: BOOTSTRAP_HANDLE
        sync: false
      - key: BOOTSTRAP_EMAIL
        sync: false
      - key: BOOTSTRAP_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: ADMIN_ENCRYPTION_KEY
        sync: false
      - key: FORWARDED_ALLOW_IPS
        value: "127.0.0.1"
      - key: PUBLIC_INDEXING
        value: "0"
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
      - key: MINOR_ACCOUNTS_ENABLED
        value: "0"
      - key: AUTO_BACKUP_ENABLED
        value: "0"
      # Configure os campos abaixo no ambiente privado ANTES de tentar abrir inscrições.
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: AGE_PROVIDER_URL
        sync: false
      - key: AGE_PROVIDER_ID
        sync: false
      - key: AGE_PUBLIC_KEY
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
