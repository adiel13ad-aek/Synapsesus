function initial(){const stamp=now();const actors=[{id:'synapse',name:'Equipe Synapse',handle:'synapse',bio:'Descubra, guarde, compartilhe. Perfil editorial fictício.',color:'mint',seeded:1},{id:'lia',name:'Lia Martins',handle:'lia.cria',bio:'Design, referências e boas perguntas. Perfil fictício.',color:'rose',seeded:1},{id:'caio',name:'Caio Costa',handle:'caio.explora',bio:'Ciência, tecnologia e curiosidade. Perfil fictício.',color:'blue',seeded:1},{id:'demo-me',name:'Você',handle:'voce',bio:'Explorando o novo Synapse.',color:'mint',seeded:0}].map(a=>({...a,kind:'human',followers:0,created_at:stamp}));return {version:'0.3.0',mode:'demo',search_provider:'external',csrf:'demo-local',me:actors[3],actors,following:[],saved:[],blocked:[],links:[],reports_count:0,posts:[{id:'discover-v03',author_id:'synapse',body:'A internet é grande demais para explorar sozinho.\n\nPesquise um assunto, salve seus links e transforme uma descoberta em conversa. Bem-vindo ao novo Synapse. #descobertas',link_url:'https://pt.wikipedia.org/',link_title:'Um ponto de partida para a sua curiosidade'},{id:'design-v03',author_id:'lia',body:'Hoje a minha pasta de referências virou uma coleção de ideias. Qual foi a melhor coisa que você encontrou na internet esta semana? #design #criacao',link_url:'https://developer.mozilla.org/pt-BR/',link_title:'Referências para criar na web'}].map(p=>({...p,source:'seed',created_at:stamp,comments:[],likes:0,liked:false,image_path:'',image_alt:''}))};}
let D=initial();try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved?.version==='0.3.0'&&Array.isArray(saved.posts)&&Array.isArray(saved.actors)&&Array.isArray(saved.links))D=saved;}catch{temporary=true;}
function persist(){if(temporary)return;try{localStorage.setItem(KEY,JSON.stringify(D));}catch{throw new Error('Não há espaço para salvar a demo neste navegador. Remova uma imagem ou use a versão com servidor.');}}
function clone(v){return JSON.parse(JSON.stringify(v));}
function toggle(arr,value){const i=arr.indexOf(value);if(i<0){arr.push(value);return true;}arr.splice(i,1);return false;}
function safe(value){try{const u=new URL(value);if(!['http:','https:'].includes(u.protocol)||u.username||u.password||!u.hostname.includes('.')||/^(127\.|10\.|192\.168\.|169\.254\.)/.test(u.hostname)||u.hostname.endsWith('.local'))throw 0;return u.href;}catch{throw new Error('Use um link público HTTP ou HTTPS, sem usuário e senha.');}}
function snapshot(){const s=clone(D);s.posts=s.posts.filter(p=>!s.blocked.includes(p.author_id)).slice(0,100);s.actors.forEach(a=>a.followers=D.following.includes(a.id)?1:0);return s;}
async function request(path,method='GET',data={}){const u=new URL(path,'https://synapse.demo');const p=u.pathname.split('/').filter(Boolean);if(method==='GET'){
if(u.pathname==='/api/state')return snapshot();
if(u.pathname==='/api/account/export')return clone(D);
if(u.pathname==='/api/search'){const q=u.searchParams.get('q')||'',scope=u.searchParams.get('scope')||'social',needle=fold(q),s=snapshot();if(['web','wiki'].includes(scope))return {query:q,scope,provider:'external',results:[],notice:scope==='wiki'?'Nesta demo sem servidor, use o botão Wikipédia para pesquisar na enciclopédia em outra aba. A versão com servidor inclui um adaptador de busca.':'Nesta demo, escolha um buscador abaixo para abrir uma pesquisa real em outra aba. A demo não possui um índice próprio da web.'};return {query:q,scope,provider:'synapse',results:[],posts:scope==='people'?[]:s.posts.filter(x=>fold(x.body+' '+x.link_title+' '+x.link_url).includes(needle)),people:s.actors.filter(a=>!s.blocked.includes(a.id)&&fold(a.name+' '+a.handle+' '+a.bio).includes(needle))};}
if(p[1]==='messages')return {messages:[]};
throw new Error('Recurso indisponível nesta demonstração.');
}
const before=clone(D);try{let result={ok:true};
if(u.pathname==='/api/posts'&&method==='POST'){const pid=id();D.posts.unshift({id:pid,author_id:D.me.id,body:String(data.body).trim(),source:'human',created_at:now(),link_url:data.link_url?safe(data.link_url):'',link_title:data.link_title||'',image_path:data.image_data||'',image_alt:data.image_alt||'',liked:false,likes:0,comments:[]});result={id:pid};}
else if(p[1]==='posts'){const post=D.posts.find(x=>x.id===p[2]);if(!post)throw new Error('Publicação indisponível.');if(method==='DELETE'){if(post.author_id!==D.me.id)throw new Error('Você só pode excluir suas publicações.');D.posts=D.posts.filter(x=>x.id!==post.id);D.saved=D.saved.filter(x=>x!==post.id);}else if(p[3]==='like'){post.liked=!post.liked;post.likes+=post.liked?1:-1;result={active:post.liked};}else if(p[3]==='save')result={active:toggle(D.saved,post.id)};else if(p[3]==='comments'){post.comments.push({id:id(),post_id:post.id,author_id:D.me.id,body:String(data.body).trim(),created_at:now()});}else if(p[3]==='report')D.reports_count++;else throw new Error('Ação indisponível.');}
else if(p[1]==='actors'){if(p[2]===D.me.id)throw new Error('Escolha outro perfil.');if(p[3]==='follow')result={active:toggle(D.following,p[2])};else if(p[3]==='block'){result={active:toggle(D.blocked,p[2])};if(result.active)D.following=D.following.filter(x=>x!==p[2]);}}
else if(u.pathname==='/api/profile'){Object.assign(D.me,{name:data.name,bio:data.bio});Object.assign(D.actors.find(a=>a.id===D.me.id),{name:data.name,bio:data.bio});}
else if(p[1]==='links'){if(method==='DELETE')D.links=D.links.filter(l=>l.id!==p[2]);else{const url=safe(data.url),existing=D.links.find(l=>l.url===url);if(existing)Object.assign(existing,{title:data.title,collection:data.collection,note:data.note});else{if(D.links.length>=500)throw new Error('Limite: 500 links por conta.');D.links.unshift({id:id(),owner_id:D.me.id,url,title:data.title,collection:data.collection,note:data.note,created_at:now()});}}}
else if(p[1]==='messages')throw new Error('A demo não envia mensagens reais. Use duas contas na versão com servidor.');
else throw new Error('Esta ação requer a versão com servidor.');
persist();return result;}catch(error){D=before;throw error;}
}
window.SynapseDemo={request,get temporary(){return temporary;},reset(){D=initial();try{localStorage.removeItem(KEY);}catch{}persist();}};
})();

const paths={home:'m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z',search:'M21 21l-5-5M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',compass:'M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0ZM16 8l-3 5-5 3 3-5Z',save:'M6 3h12v18l-6-4-6 4Z',plus:'M12 5v14M5 12h14',heart:'M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8',message:'M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9H13a8.5 8.5 0 0 1 8 8v.5',user:'M20 21v-2a7 7 0 0 0-14 0v2M17 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0',arrow:'M5 12h14m-6-6 6 6-6 6',external:'M14 3h7v7m0-7-12 12M10 3H4v17h17v-7',globe:'M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0ZM2 12h20M12 2a18 18 0 0 1 0 20 18 18 0 0 1 0-20',image:'M3 3h18v18H3ZM3 16l6-6 5 5 3-3 4 4M16 7h.01',close:'M6 6l12 12M18 6 6 18',link:'M10 13a5 5 0 0 0 7 .2l3-3a5 5 0 0 0-7-7l-2 2M14 11a5 5 0 0 0-7-.2l-3 3a5 5 0 0 0 7 7l2-2',folder:'M3 5h6l2 3h10v12H3Z',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2',send:'m22 2-7 20-4-9L2 9Zm0 0L11 13',refresh:'M20 7v5h-5M4 17v-5h5M6 5a8 8 0 0 1 14 7M4 12a8 8 0 0 0 14 7',lock:'M5 10h14v11H5ZM8 10V6a4 4 0 0 1 8 0v4',more:'M5 12h.01M12 12h.01M19 12h.01',check:'m5 12 4 4L19 6',back:'m14 5-7 7 7 7',trash:'M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7',spark:'m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3Z'};
const icon=n=>`<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.compass}"/></svg>`;
const initials=n=>String(n||'S').split(/\s+/).slice(0,2).map(s=>s[0]).join('').toUpperCase();
const avatar=(p,size='')=>`<span class="avatar ${['blue','mint','rose','violet','amber'].includes(p?.color)?p.color:'blue'} ${size}">${esc(initials(p?.name))}</span>`;
const fold=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const external=(url)=>{try{const u=new URL(url);return ['http:','https:'].includes(u.protocol)&&!u.username&&!u.password?u.href:'';}catch{return '';}};
const host=url=>{try{return new URL(url).hostname.replace(/^www\./,'');}catch{return 'Link externo';}};

let S={me:null,actors:[],posts:[],following:[],saved:[],blocked:[],links:[],csrf:'',search_provider:'external'};
const V={page:'feed',filter:'all',query:'',scope:'social',result:null,searching:false,searchError:'',profile:null,collection:'all',comments:new Set(),chat:null,messages:[],auth:'register',image:'',busy:false};
let searchTicket=0,toastTimer,chatTicket=0;

const me=()=>S.me?person(S.me.id):{name:'Visitante',handle:'visitante',color:'mint'};
async function api(path,method='GET',data){
  if(DEMO)return window.SynapseDemo.request(path,method,data);
  const r=await fetch(path,{method,credentials:'same-origin',headers:{'Content-Type':'application/json','X-Synapse-Client':'web-v03',...(S.csrf?{'X-CSRF-Token':S.csrf}:{})},...(data!==undefined?{body:JSON.stringify(data)}:{})});
  let result;try{result=await r.json();}catch{throw new Error('O servidor não retornou uma resposta válida.');}
  if(!r.ok)throw new Error(typeof result.detail==='string'?result.detail:'Confira os dados enviados e tente novamente.');
  return result;
}
async function refresh(render=true){S=await api('/api/state');if(render)draw();}
function toast(text){const t=$('#toast');t.textContent=text;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),4500);}
function requireAccount(){if(S.me)return true;authDialog();return false;}
function empty(title,text,action='',name='compass'){return `<div class="empty">${icon(name)}<h3>${esc(title)}</h3><p>${esc(text)}</p>${action}</div>`;}
function navigation(mobile=false){const items=mobile?[['feed','home','Feed'],['explore','compass','Explorar'],['new','plus','Criar'],['collections','save','Coleções'],['profile','user','Perfil']]:[['feed','home','Seu feed'],['explore','compass','Explorar'],['collections','folder','Coleções'],['messages','message','Mensagens'],['profile','user','Meu perfil'],['new','plus','Criar publicação']];return items.map(([id,i,label])=>`<button ${id==='new'?'data-action="new-post"':`data-go="${id}"`} class="${V.page===id?'active ':''}${id==='new'?(mobile?'new':'create'):''}" ${V.page===id?'aria-current="page"':''}>${icon(i)}<span>${label}</span></button>`).join('');}
function draw(){
  const sidebar=`<aside class="sidebar"><button class="brand" data-go="feed" aria-label="Synapse, início"><span class="brand-mark">${icon('spark')}</span><span class="brand-label">synapse</span></button><nav class="nav" aria-label="Principal">${navigation()}</nav><div class="sidebar-note"><b>Um clique. Uma descoberta.</b>A web fica melhor quando a gente explora junto.</div><div class="account">${S.me?`<button class="account-button" data-go="settings">${avatar(me())}<span class="grow"><strong>${esc(S.me.name)}</strong><small>@${esc(S.me.handle)}</small></span>${icon('settings')}</button>`:`<button class="btn primary" data-action="auth">${icon('user')}<span class="brand-label">Entrar</span></button>`}</div></aside>`;
  const top=`<header class="topbar"><button class="mobile-brand" data-go="feed"><span class="brand-mark">${icon('spark')}</span>synapse</button><form class="searchbar" data-form="search"><label for="global-search" class="sr-only">Pesquisar na rede ou abrir a busca web</label>${icon('search')}<input id="global-search" name="q" maxlength="200" placeholder="Pesquise pessoas, assuntos ou um site…" value="${esc(V.query)}" required><button type="submit">Explorar</button></form><span class="top-state"><i></i>${DEMO?'Demonstração local':'Protótipo privado · 0.3'}</span><button class="iconbtn" data-go="messages" aria-label="Mensagens">${icon('message')}</button></header>`;
  $('#app').innerHTML=`<div class="shell">${sidebar}<div class="workspace">${top}<div class="content"><main class="main" id="main">${DEMO?'<div class="demo-notice">'+icon('info')+'Demo local: perfis fictícios. Não há conexão entre usuários.</div>':''}${view()}</main>${rightbar()}</div></div></div><nav class="bottom-nav" aria-label="Navegação móvel">${navigation(true)}</nav>`;
}
function rightbar(){const suggestions=S.actors.filter(a=>a.id!==S.me?.id&&!S.blocked.includes(a.id)&&!S.following.includes(a.id)).slice(0,3);return `<aside class="rightbar"><section class="panel"><div class="row spread"><h3>Pessoas para descobrir</h3>${icon('user')}</div>${suggestions.map(a=>`<div class="suggestion row">${avatar(a,'sm')}<button class="profilelink grow" data-action="profile" data-id="${esc(a.id)}"><strong>${esc(a.name)}</strong><small>@${esc(a.handle)}${a.seeded?' · exemplo':''}</small></button><button class="btn ghost small" data-action="follow" data-id="${esc(a.id)}" aria-label="Seguir ${esc(a.name)}">${icon('plus')}</button></div>`).join('')||'<p class="muted tiny">Você já encontrou todos os perfis deste piloto.</p>'}</section><section class="panel"><h3>Comece por um assunto</h3>${[['Tecnologia','Ideias que viram realidade'],['Design','Novas formas de ver'],['Ciência','Perguntas que conectam']].map(([t,d],i)=>`<button class="topic" data-action="topic" data-query="${t}"><span class="number">0${i+1}</span><span class="grow"><strong>${t}</strong><small>${d}</small></span>${icon('arrow')}</button>`).join('')}<p class="tiny muted">Sugestões editoriais, não tendências ao vivo.</p></section><section class="guide"><div class="symbol">↗</div><h3>Encontrou algo<br>que vale guardar?</h3><p>Links, referências e boas ideias. Suas coleções são privadas; você escolhe o que publicar.</p><button class="btn small secondary" data-go="collections">Criar uma coleção ${icon('arrow')}</button></section><p class="fineprint">Synapse 0.3 · Piloto privado<br>Sem afiliação com Google ou Instagram.<br>Busca não é verificação de fatos.<br><button data-go="settings">Privacidade e limites</button></p></aside>`;}

function renderFeed(){const posts=S.posts.filter(p=>!S.blocked.includes(p.author_id)&&(V.filter==='all'||S.following.includes(p.author_id)));return `<section class="hero"><p class="eyebrow">A SUA CURIOSIDADE CONECTA</p><h1>Descubra a web.<br>Encontre sua gente.</h1><p>Boas descobertas merecem mais do que uma aba esquecida.</p><button class="btn" data-go="explore">Explore uma nova ideia ${icon('arrow')}</button><span class="hero-label">PESQUISAR · GUARDAR · COMPARTILHAR</span></section><div class="tabs"><button data-action="feed-filter" data-id="all" class="${V.filter==='all'?'active':''}">Descobertas</button><button data-action="feed-filter" data-id="following" class="${V.filter==='following'?'active':''}">Seguindo</button><button class="end" data-action="refresh" aria-label="Atualizar feed">${icon('refresh')}</button></div><div class="compose-mini">${avatar(me())}<button class="prompt" data-action="new-post">O que você descobriu hoje?</button><button class="iconbtn" data-action="new-post" aria-label="Publicar foto">${icon('image')}</button><button class="iconbtn" data-action="new-post" aria-label="Compartilhar link">${icon('link')}</button></div>${posts.length?posts.map(postCard).join(''):empty('Seu feed está começando.','Siga alguém ou compartilhe sua primeira descoberta.')}<p class="footer-note">Ordem cronológica. O piloto mostra até 100 publicações recentes; não há recomendação por IA.</p>`;}
function linkCard(url,title){const safe=external(url);if(!safe)return '';return `<a class="link-card" href="${esc(safe)}" target="_blank" rel="noopener noreferrer"><span class="site-icon">${icon('globe')}</span><span class="grow"><strong>${esc(title||host(safe))}</strong><small>${esc(host(safe))} · abrir site em outra aba</small></span>${icon('external')}</a>`;}
function postCard(p){const a=person(p.author_id);const image=imageSrc(p.image_path);return `<article class="post" data-post="${esc(p.id)}"><header class="post-head"><button class="profilelink" data-action="profile" data-id="${esc(a.id)}">${avatar(a)}</button><button class="profilelink grow" data-action="profile" data-id="${esc(a.id)}"><strong>${esc(a.name)}${a.seeded?'<span class="example">exemplo</span>':''}</strong><small>@${esc(a.handle)} · ${esc(stamp(p.created_at))}</small></button><button class="iconbtn" data-action="post-menu" data-id="${esc(p.id)}" aria-label="Opções da publicação">${icon('more')}</button></header><p class="post-body">${esc(p.body)}</p>${image?`<img class="post-media" src="${esc(image)}" alt="${esc(p.image_alt||'Imagem publicada pelo usuário')}" loading="lazy">`:p.id==='discover-v03'?'<div class="editorial"><small>O MUNDO É UMA DESCOBERTA</small><strong>Menos rolar.<br>Mais encontrar.</strong><small>synapse / descubra junto</small></div>':p.id==='design-v03'?'<div class="editorial design"><small>REFERÊNCIAS PARA CRIAR</small><strong>Ideias boas<br>não ficam paradas.</strong><small>curadoria da comunidade</small></div>':''}${linkCard(p.link_url,p.link_title)}<div class="post-actions"><button data-action="like" data-id="${esc(p.id)}" aria-label="Curtir" aria-pressed="${!!p.liked}">${icon('heart')}<span>${p.likes||0}</span></button><button data-action="comments" data-id="${esc(p.id)}" aria-label="Comentários" aria-expanded="${V.comments.has(p.id)}">${icon('message')}<span>${p.comments.length}</span></button>${p.link_url?`<button data-action="collect" data-url="${esc(p.link_url)}" data-title="${esc(p.link_title||host(p.link_url))}">${icon('link')}<span class="label">Guardar link</span></button>`:''}<button class="save" data-action="save-post" data-id="${esc(p.id)}" aria-label="Salvar publicação" aria-pressed="${S.saved.includes(p.id)}">${icon('save')}</button></div>${V.comments.has(p.id)?`<section class="comments">${p.comments.map(c=>`<p class="comment"><b>${esc(person(c.author_id).name)}</b>${esc(c.body)}</p>`).join('')||'<p class="tiny muted">Comece a conversa.</p>'}<form class="comment-form" data-form="comment" data-id="${esc(p.id)}"><input name="body" aria-label="Escreva um comentário" placeholder="Adicione um comentário…" maxlength="600" required><button class="iconbtn" type="submit" aria-label="Enviar comentário">${icon('send')}</button></form></section>`:''}</article>`;}
function searchForm(){return `<form class="search-large" data-form="search">${icon('search')}<label for="explore-query" class="sr-only">Assunto ou endereço de site</label><input id="explore-query" name="q" value="${esc(V.query)}" placeholder="O que desperta sua curiosidade?" maxlength="200" required><button type="submit" aria-label="Pesquisar">${icon('arrow')}</button></form>`;}
function shortcuts(){const q=encodeURIComponent(V.query);return `<div class="external-options">${V.scope==='wiki'?`<a class="btn secondary" target="_blank" rel="noopener noreferrer" href="https://pt.wikipedia.org/w/index.php?search=${q}">Wikipédia ${icon('external')}</a>`:''}<a class="btn secondary" target="_blank" rel="noopener noreferrer" href="https://www.google.com/search?q=${q}">Google ${icon('external')}</a><a class="btn secondary" target="_blank" rel="noopener noreferrer" href="https://search.brave.com/search?q=${q}">Brave ${icon('external')}</a><a class="btn secondary" target="_blank" rel="noopener noreferrer" href="https://duckduckgo.com/?q=${q}">DuckDuckGo ${icon('external')}</a></div>`;}
function renderExplore(){let url=external(V.query);if(!url&&/^[\w-]+(?:\.[\w-]+)+(?:\/[^\s]*)?$/.test(V.query))url=external('https://'+V.query);return `<section class="search-hero"><p class="eyebrow">UM LUGAR PARA TODAS AS SUAS IDEIAS</p><h1>A próxima descoberta<br>começa com <em>uma pergunta.</em></h1><p>Pesquise na rede, explore a internet e leve suas referências com você.</p>${searchForm()}</section><div class="tabs">${[['social','Na rede'],['web','Web'],['people','Pessoas'],['wiki','Wikipédia']].map(([id,t])=>`<button data-action="scope" data-id="${id}" class="${V.scope===id?'active':''}">${t}</button>`).join('')}</div><p class="privacy-note">${V.scope==='social'||V.scope==='people'?'Busca apenas nas publicações e nos perfis deste servidor. Não envia a consulta a um buscador externo.':V.scope==='wiki'?'Ao pesquisar nesta aba, a consulta é enviada à Wikipédia. Resultados enciclopédicos, não uma busca em toda a web.':S.search_provider==='brave'?'Ao pesquisar nesta aba, a consulta é enviada ao Brave Search pelo servidor. Os sites abrem em outra aba.':'Neste piloto, a busca ampla abre no buscador escolhido. Só clicar no atalho envia a consulta a esse buscador.'} Pesquisas e coleções não viram posts automaticamente.</p>${url?`<div class="result"><div class="origin">${icon('globe')} Endereço digitado</div><h3>${esc(host(url))}</h3><p>${esc(url)}</p><div class="result-actions"><a class="btn secondary small" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Abrir site ${icon('external')}</a><button data-action="collect" data-url="${esc(url)}" data-title="${esc(host(url))}">${icon('save')} Guardar</button><button data-action="share-link" data-url="${esc(url)}" data-title="${esc(host(url))}">${icon('send')} Compartilhar</button></div></div>`:''}${!V.query?`<div class="topic-grid">${[['Tecnologia','Construa o próximo passo.'],['Design','Olhe de outro jeito.'],['Ciência','Faça novas perguntas.'],['Fotografia','Encontre novas perspectivas.']].map(([t,d])=>`<button class="topic-card" data-action="topic" data-query="${t}">${icon('external')}<strong>${t}</strong><small>${d}</small></button>`).join('')}</div><p class="footer-note">Sugestões editoriais. Não são tendências nem resultados de uma busca ao vivo.</p>`:searchResults()}`;}
function searchResults(){if(V.searching)return '<div class="loading" role="status">Pesquisando…</div>';if(V.searchError)return `<div class="notice error" role="alert">${esc(V.searchError)}</div>${shortcuts()}`;const r=V.result;if(!r)return '';if(r.provider==='external')return `<div class="notice"><b>Continue sua pesquisa na web</b><p>${esc(r.notice)}</p></div>${shortcuts()}<p class="tiny muted">Para mostrar resultados gerais dentro do Synapse, configure a API de pesquisa no servidor. Não há resultados inventados aqui.</p>`;if(V.scope==='people')return `<div class="people-grid">${r.people?.length?r.people.map(personCard).join(''):empty('Nenhum perfil encontrado.','Experimente outro nome ou assunto.','','user')}</div>`;if(V.scope==='social')return `${r.people?.length?`<h3 class="muted">Pessoas</h3><div class="people-grid">${r.people.slice(0,3).map(personCard).join('')}</div>`:''}${r.posts?.length?r.posts.map(postCard).join(''):empty('Ainda não há publicações sobre isso.','Explore a aba Web ou compartilhe uma referência para começar a conversa.')}<p class="footer-note">A busca do piloto cobre até 100 posts recentes e 500 perfis.</p>`;return `<div class="row spread"><p class="tiny muted">${r.results?.length||0} resultados · ${r.provider==='wikipedia'?'Wikipédia em português':'Brave Search'}</p></div><br>${r.results?.length?r.results.map(resultCard).join(''):empty('Nenhum resultado retornado.','Tente reformular sua pesquisa.')}${shortcuts()}${V.scope==='wiki'?'<p class="footer-note">Trechos atribuídos à Wikipédia. Consulte o artigo e seu histórico para fontes, autoria e licença. Conteúdo pode conter erros.</p>':''}`;}
function resultCard(r){const url=external(r.url);if(!url)return '';return `<article class="result"><div class="origin">${icon('globe')} ${esc(r.provider||host(url))} · ${esc(host(url))}</div><a href="${esc(url)}" target="_blank" rel="noopener noreferrer"><h3>${esc(r.title)}</h3></a>${r.description?`<p>${esc(r.description)}</p>`:''}<div class="result-actions"><a class="btn small secondary" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Abrir ${icon('external')}</a><button data-action="collect" data-url="${esc(url)}" data-title="${esc(r.title.slice(0,180))}">${icon('save')} Guardar</button><button data-action="share-link" data-url="${esc(url)}" data-title="${esc(r.title.slice(0,180))}">${icon('send')} Compartilhar</button></div></article>`;}
function personCard(a){return `<article class="person-card">${avatar(a)}<button class="grow profilelink" data-action="profile" data-id="${esc(a.id)}"><strong>${esc(a.name)}${a.seeded?'<span class="example">exemplo</span>':''}</strong><p>@${esc(a.handle)}<br>${esc(a.bio.slice(0,100))}</p></button>${a.id!==S.me?.id?`<button class="btn small secondary" data-action="follow" data-id="${esc(a.id)}">${S.following.includes(a.id)?'Seguindo':'Seguir'}</button>`:''}</article>`;}
function renderCollections(){if(!S.me)return empty('Seu canto de referências.','Entre para guardar links e publicações em coleções privadas.','<button class="btn primary" data-action="auth">Entrar</button>','folder');const names=[...new Set(S.links.map(l=>l.collection))];const links=S.links.filter(l=>V.collection==='all'||l.collection===V.collection);const posts=S.posts.filter(p=>S.saved.includes(p.id));return `<header class="page-head row spread"><div><p class="eyebrow">SUA BIBLIOTECA PESSOAL</p><h2>Guarde o que importa.</h2><p>${icon('lock')} Coleções privadas, por padrão.</p></div><button class="btn primary small" data-action="collect">${icon('plus')} Guardar link</button></header><div class="collection-chips">${[['all',`Todos os links · ${S.links.length}`],...names.map(n=>[n,n]),['posts',`Posts salvos · ${S.saved.length}`]].map(([id,t])=>`<button class="chip ${V.collection===id?'active':''}" data-action="collection" data-id="${esc(id)}">${esc(t)}</button>`).join('')}</div>${V.collection==='posts'?(posts.length?posts.map(postCard).join(''):empty('Nenhuma publicação salva.','Use o marcador no rodapé de uma publicação para guardar.','','save')):links.length?links.map(l=>`<article class="result"><div class="origin">${icon('folder')} ${esc(l.collection)} · ${esc(host(l.url))}</div><a href="${esc(external(l.url))}" target="_blank" rel="noopener noreferrer"><h3>${esc(l.title)}</h3></a><p>${esc(l.note||'Você guardou este link. Só você vê esta coleção.')}</p><div class="result-actions"><a class="btn secondary small" href="${esc(external(l.url))}" target="_blank" rel="noopener noreferrer">Abrir ${icon('external')}</a><button data-action="share-link" data-url="${esc(l.url)}" data-title="${esc(l.title)}">${icon('send')} Compartilhar</button><button data-action="edit-link" data-id="${esc(l.id)}">${icon('folder')} Editar</button><button data-action="delete-link" data-id="${esc(l.id)}">${icon('trash')} Remover</button></div></article>`).join(''):empty('Uma coleção começa com um link.','Guarde um site, escolha o nome da coleção e adicione uma nota só sua.','<button class="btn primary" data-action="collect">Guardar primeiro link</button>','folder')}`;}
function renderProfile(){const a=V.profile?person(V.profile):S.me?me():null;if(!a)return empty('Sua história começa aqui.','Crie uma conta para publicar, seguir pessoas e guardar descobertas.','<button class="btn primary" data-action="auth">Criar conta</button>','user');const own=a.id===S.me?.id;const posts=S.posts.filter(p=>p.author_id===a.id);return `<div class="profile-hero">${avatar(a,'lg')}<h2>${esc(a.name)}</h2><p>@${esc(a.handle)}${a.seeded?' · Perfil fictício de demonstração':''}</p><p>${esc(a.bio||'Uma pessoa curiosa explorando a internet.')}</p><div class="profile-stats"><span><b>${posts.length}</b>posts visíveis</span><span><b>${a.followers||0}</b>seguidores</span></div><div class="row">${own?'<button class="btn secondary" data-action="edit-profile">Editar perfil</button><button class="btn ghost" data-go="settings">'+icon('settings')+' Configurações</button>':`<button class="btn primary" data-action="follow" data-id="${esc(a.id)}">${S.following.includes(a.id)?'Deixar de seguir':'Seguir'}</button>${!a.seeded?`<button class="btn secondary" data-action="chat" data-id="${esc(a.id)}">${icon('message')} Conversar</button>`:''}<button class="btn ghost" data-action="block" data-id="${esc(a.id)}">${S.blocked.includes(a.id)?'Desbloquear':'Bloquear'}</button>`}</div></div>${posts.length?posts.map(postCard).join(''):empty('Este perfil ainda está começando.','As publicações disponíveis aparecerão aqui.')}`;}
function renderMessages(){if(!S.me)return empty('Converse com sua gente.','Entre para trocar mensagens com outras contas reais deste servidor.','<button class="btn primary" data-action="auth">Entrar</button>','message');const targets=S.actors.filter(a=>a.id!==S.me.id&&!a.seeded&&!S.blocked.includes(a.id));return `<header class="page-head"><p class="eyebrow">IDEIAS CONTINUAM EM CONVERSA</p><h2>Mensagens</h2><p>Privadas na aplicação, mas sem criptografia de ponta a ponta.</p></header>${DEMO?'<div class="notice">Esta demo não troca mensagens com pessoas reais. Use o servidor e duas contas para testar.</div>':''}${!targets.length?empty('As pessoas ainda vão chegar.','Crie outra conta em uma janela anônima, usando o mesmo servidor. Os perfis de exemplo não respondem.','','message'):`<label class="tiny muted" for="chat-target">Escolha uma pessoa</label><select id="chat-target"><option value="">Selecione…</option>${targets.map(a=>`<option value="${esc(a.id)}" ${V.chat===a.id?'selected':''}>${esc(a.name)} · @${esc(a.handle)}</option>`).join('')}</select><br><br>${V.chat?`<section class="chat"><div class="row">${avatar(person(V.chat))}<div><strong>${esc(person(V.chat).name)}</strong><p class="tiny muted">Mensagens atualizadas a cada 8 segundos.</p></div></div><div id="chat-messages" class="chat-messages">${messageBubbles()}</div><form data-form="message" class="chat-form"><textarea name="body" maxlength="1500" placeholder="Uma pergunta, uma ideia, um olá…" aria-label="Mensagem" required></textarea><button class="btn primary" type="submit" aria-label="Enviar mensagem">${icon('send')}</button></form></section>`:empty('Escolha uma conversa.','As mensagens ficam no servidor, acessíveis aos participantes e ao operador.','','message')}`}`;}
function messageBubbles(){return V.messages.length?V.messages.map(m=>`<div class="bubble ${m.sender_id===S.me?.id?'mine':''}">${esc(m.body)}<small>${esc(new Date(m.created_at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}))}</small></div>`).join(''):'<p class="muted tiny">Comece a conversa.</p>';}
function renderSettings(){return `<header class="page-head"><p class="eyebrow">VOCÊ ESCOLHE O QUE COMPARTILHA</p><h2>Seu espaço, seu controle.</h2></header><section class="settings-section"><h3>Como esta versão funciona</h3><p>Feed e perfis são visíveis a quem acessa este servidor. Coleções são privadas. Nenhum agente de IA está ativo. Sites externos abrem em outra aba; não há um navegador embutido nem acesso a contas privadas de outros serviços.</p><p>Não armazenamos um histórico de pesquisas no banco. O provedor externo e a infraestrutura de hospedagem podem registrar consultas. A API integrada só é usada na aba escolhida.</p><span class="pill">${DEMO?'Demonstração local':'Servidor próprio'} · v0.3</span></section><section class="settings-section"><h3>Limites do protótipo</h3><p>Não há vídeos, stories, chamadas, notificações push ou moderação operada. Denúncias são registradas, mas não analisadas automaticamente. Use apenas dados de teste e um grupo privado.</p><p>O modelo de busca integrada e a instalação PWA precisam de configuração. Não é uma versão publicada nas lojas.</p></section>${S.me?`<section class="settings-section"><h3>Seus dados</h3><p>Você pode exportar seus dados em JSON ou remover sua conta. As imagens devem ser incluídas no backup da pasta de dados do servidor.</p><div class="row wrap"><button class="btn secondary" data-action="export">Exportar dados</button><button class="btn secondary" data-action="edit-profile">Editar perfil</button>${!DEMO?'<button class="btn ghost" data-action="logout">Sair da conta</button>':''}</div></section><section class="settings-section"><h3>Perfis bloqueados</h3>${S.blocked.length?S.blocked.map(id=>`<div class="row spread"><p>${esc(person(id).name)}</p><button class="btn small ghost" data-action="block" data-id="${esc(id)}">Desbloquear</button></div>`).join(''):'<p>Nenhum perfil bloqueado.</p>'}</section><section class="settings-section"><h3>Recomeçar</h3><p>${DEMO?'Limpe somente os dados desta demonstração no navegador.':'Excluir a conta remove suas publicações, imagens, links e mensagens deste banco. Backups externos não são apagados automaticamente.'}</p><button class="btn danger" data-action="delete-account">${DEMO?'Redefinir demonstração':'Excluir minha conta'}</button></section>`:'<button class="btn primary" data-action="auth">Entrar ou criar conta</button>'}`;}
function dialog(title,body,note=''){$('#dialog').innerHTML=`<header class="dialog-head"><h2 id="dialog-title">${esc(title)}</h2><button class="iconbtn" data-action="close" aria-label="Fechar">${icon('close')}</button></header>${note?`<p class="dialog-note">${esc(note)}</p>`:''}${body}`;if(!$('#dialog').open)$('#dialog').showModal();}
function authDialog(){if(DEMO)return;const reg=V.auth==='register';dialog('Seu lugar na descoberta.',`<div class="login-toggle"><button data-action="auth-mode" data-id="register" class="${reg?'active':''}">Criar conta</button><button data-action="auth-mode" data-id="login" class="${!reg?'active':''}">Entrar</button></div><form data-form="auth"><div class="form-grid">${reg?'<label>Seu nome<input name="name" required minlength="2" maxlength="50" autocomplete="name"></label>':''}<label>Nome de usuário<input name="handle" required ${reg?'pattern="[a-zA-Z0-9_.]{3,24}" minlength="3" maxlength="24"':'maxlength="64"'} autocomplete="username" placeholder="seu.nome"></label><label>Senha<input type="password" name="password" required minlength="${reg?'10':'1'}" maxlength="128" autocomplete="${reg?'new-password':'current-password'}"></label></div><p class="form-error" role="alert"></p><div class="dialog-footer"><button type="submit" class="btn primary">${reg?'Criar minha conta':'Entrar'} ${icon('arrow')}</button></div></form>`,'Piloto privado: use uma senha de teste. Não há recuperação de conta por e-mail nesta versão.');}
function compose(url='',title=''){if(!requireAccount())return;V.image='';dialog(url?'Compartilhe uma descoberta.':'O que você descobriu hoje?',`<form data-form="post"><div class="form-grid"><label>Sua publicação<textarea name="body" rows="4" maxlength="2000" placeholder="Conte o que torna isso interessante…" required>${url?esc('Uma descoberta para compartilhar: '+title):''}</textarea></label><label>Link do site (opcional)<input type="url" name="link_url" maxlength="2048" value="${esc(url)}" placeholder="https://exemplo.com"></label><label>Título do link (opcional)<input name="link_title" maxlength="180" value="${esc(title)}" placeholder="Dê um nome à sua descoberta"></label><label class="upload-label">${icon('image')} Uma imagem (opcional)<input type="file" id="image-file" accept="image/jpeg,image/png,image/webp"><small>JPEG, PNG ou WebP · até 3 MB e 16 megapixels.</small><span id="image-preview"></span></label><label>Descrição da imagem<input name="image_alt" maxlength="250" placeholder="Descreva para quem usa leitor de tela"></label></div><p class="form-error" role="alert"></p><div class="dialog-footer"><button type="button" class="btn ghost" data-action="close">Cancelar</button><button type="submit" class="btn primary">Publicar ${icon('send')}</button></div></form>`,'A publicação será visível no feed. Somente o link será compartilhado, não o conteúdo completo do site.');}
function collect(url='',title='',collection='Favoritos',note=''){if(!requireAccount())return;dialog('Guarde uma boa descoberta.',`<form data-form="collect"><div class="form-grid"><label>Endereço do site<input name="url" type="url" maxlength="2048" value="${esc(url)}" placeholder="https://exemplo.com" required></label><label>Título<input name="title" maxlength="180" value="${esc(title)}" placeholder="Um nome fácil de encontrar" required></label><label>Coleção<input name="collection" maxlength="50" list="collection-names" value="${esc(collection)}" required><datalist id="collection-names">${[...new Set(S.links.map(l=>l.collection))].map(n=>`<option value="${esc(n)}">`).join('')}</datalist><small>Digite um novo nome para criar uma coleção.</small></label><label>Uma nota só sua<textarea name="note" maxlength="600" rows="3" placeholder="Por que você guardou este link?">${esc(note)}</textarea></label></div><p class="form-error" role="alert"></p><div class="dialog-footer"><button type="submit" class="btn primary">${icon('lock')} Guardar na coleção</button></div></form>`,'Só sua conta vê esta coleção. Guardar um link não cria uma publicação.');}
function editProfile(){if(!requireAccount())return;dialog('Deixe com a sua cara.',`<form data-form="profile"><div class="form-grid"><label>Nome<input name="name" value="${esc(S.me.name)}" minlength="2" maxlength="50" required></label><label>Sobre você<textarea name="bio" maxlength="300" rows="4">${esc(S.me.bio)}</textarea></label></div><p class="form-error" role="alert"></p><div class="dialog-footer"><button class="btn primary" type="submit">Salvar perfil</button></div></form>`);}
function postMenu(id){const p=S.posts.find(p=>p.id===id)||V.result?.posts?.find(p=>p.id===id);if(!p)return;dialog('Esta publicação',`<div class="stack">${p.author_id===S.me?.id?`<button class="btn danger" data-action="delete-post" data-id="${esc(id)}">${icon('trash')} Excluir minha publicação</button>`:`<form data-form="report" data-id="${esc(id)}"><div class="form-grid"><label>Motivo da denúncia<textarea name="reason" minlength="3" maxlength="500" required></textarea></label></div><p class="dialog-note">A denúncia será registrada para o operador. Não existe revisão automática neste piloto.</p><p class="form-error" role="alert"></p><button type="submit" class="btn secondary">Registrar denúncia</button></form>`}</div>`);}
function go(page){if(page==='profile')V.profile=null;V.page=page;draw();window.scrollTo({top:0});if(page==='messages'&&V.chat)loadMessages();}
async function search(q=V.query){const ticket=++searchTicket;V.query=q.trim().slice(0,200);V.page='explore';V.result=null;V.searchError='';V.searching=!!V.query;draw();if(!V.query)return;try{const r=await api('/api/search?'+new URLSearchParams({q:V.query,scope:V.scope}));if(ticket!==searchTicket)return;V.result=r;}catch(e){if(ticket!==searchTicket)return;V.searchError=e.message;}finally{if(ticket===searchTicket){V.searching=false;if(V.page==='explore')draw();}}}
async function loadMessages(){const target=V.chat;if(!target||!S.me)return;const ticket=++chatTicket;try{const r=await api('/api/messages/'+encodeURIComponent(target));if(ticket!==chatTicket||V.chat!==target)return;const changed=JSON.stringify(r.messages)!==JSON.stringify(V.messages);V.messages=r.messages;const box=$('#chat-messages');if(box&&changed){box.innerHTML=messageBubbles();box.scrollTop=box.scrollHeight;}}catch(e){toast(e.message);}}
async function updateSocial(path,method='POST',data={}){if(!requireAccount())return;await api(path,method,data);await refresh(false);if(V.page==='explore'&&['social','people'].includes(V.scope)&&V.query)await search();else draw();}
async function action(el){const a=el.dataset.action,id=el.dataset.id;if(a==='close')return $('#dialog').close();if(a==='auth')return authDialog();if(a==='auth-mode'){V.auth=id;return authDialog();}if(a==='new-post')return compose();if(a==='share-link')return compose(el.dataset.url,el.dataset.title);if(a==='collect')return collect(el.dataset.url||'',el.dataset.title||'');if(a==='edit-profile')return editProfile();if(a==='edit-link'){const l=S.links.find(l=>l.id===id);if(l)return collect(l.url,l.title,l.collection,l.note);}if(a==='profile'){V.profile=id;V.page='profile';draw();window.scrollTo({top:0});return;}if(a==='comments'){V.comments.has(id)?V.comments.delete(id):V.comments.add(id);return draw();}if(a==='post-menu')return postMenu(id);if(a==='topic')return search(el.dataset.query);if(a==='scope'){V.scope=id;return search();}if(a==='feed-filter'){V.filter=id;return draw();}if(a==='collection'){V.collection=id;return draw();}if(a==='refresh'){await refresh();toast('Feed atualizado.');return;}if(a==='chat'){if(!requireAccount())return;V.chat=id;V.messages=[];V.page='messages';draw();return loadMessages();}if(a==='logout'){await api('/api/auth/logout','POST',{});V.chat=null;V.messages=[];V.profile=null;V.page='feed';return refresh();}if(a==='export'){if(!requireAccount())return;const data=await api('/api/account/export');const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='synapse-meus-dados.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return;}if(a==='delete-account'){if(DEMO){dialog('Redefinir a demonstração?',`<p class="dialog-note">Os posts, links e preferências locais desta demo serão removidos.</p><div class="dialog-footer"><button class="btn ghost" data-action="close">Cancelar</button><button class="btn danger" data-action="reset-demo">Redefinir</button></div>`);return;}dialog('Excluir minha conta',`<form data-form="delete-account"><p class="dialog-note">Esta ação remove a conta e os dados associados deste banco. Digite sua senha para confirmar.</p><div class="form-grid"><label>Senha<input type="password" name="password" autocomplete="current-password" required></label></div><p class="form-error" role="alert"></p><div class="dialog-footer"><button class="btn danger" type="submit">Excluir definitivamente</button></div></form>`);return;}if(a==='reset-demo'){window.SynapseDemo.reset();$('#dialog').close();V.page='feed';V.collection='all';V.profile=null;return refresh();}
  if(!requireAccount())return;
  if(a==='like')return updateSocial(`/api/posts/${encodeURIComponent(id)}/like`);
  if(a==='save-post')return updateSocial(`/api/posts/${encodeURIComponent(id)}/save`);
  if(a==='follow')return updateSocial(`/api/actors/${encodeURIComponent(id)}/follow`);
  if(a==='block'){await updateSocial(`/api/actors/${encodeURIComponent(id)}/block`);toast('Preferência de bloqueio atualizada.');return;}
  if(a==='delete-link'){await updateSocial('/api/links/'+encodeURIComponent(id),'DELETE');toast('Link removido da coleção.');return;}
  if(a==='delete-post'){if(!confirm('Excluir esta publicação?'))return;await updateSocial('/api/posts/'+encodeURIComponent(id),'DELETE');$('#dialog').close();toast('Publicação excluída.');return;}
}
document.addEventListener('click',async e=>{const goEl=e.target.closest('[data-go]');if(goEl){e.preventDefault();return go(goEl.dataset.go);}const el=e.target.closest('[data-action]');if(!el)return;e.preventDefault();if(el.disabled)return;try{await action(el);}catch(error){toast(error.message||'Não foi possível concluir.');}});
document.addEventListener('submit',async e=>{const form=e.target.closest('[data-form]');if(!form)return;e.preventDefault();const type=form.dataset.form;const values=Object.fromEntries(new FormData(form));if(type==='search')return search(values.q);if(type!=='auth'&&!requireAccount())return;const button=form.querySelector('[type="submit"]');if(button?.disabled)return;if(button)button.disabled=true;const err=form.querySelector('.form-error');if(err)err.textContent='';try{
  if(type==='auth'){const r=await api('/api/auth/'+V.auth,'POST',values);S.csrf=r.csrf;$('#dialog').close();await refresh();toast('Bem-vindo ao Synapse.');}
  if(type==='post'){await api('/api/posts','POST',{...values,image_data:V.image});$('#dialog').close();V.page='feed';V.filter='all';await refresh();toast('Sua descoberta está no feed.');}
  if(type==='collect'){await api('/api/links','POST',values);$('#dialog').close();await refresh();toast('Link guardado. Sua coleção continua privada.');}
  if(type==='profile'){await api('/api/profile','PATCH',values);$('#dialog').close();await refresh();toast('Perfil atualizado.');}
  if(type==='comment'){await updateSocial(`/api/posts/${encodeURIComponent(form.dataset.id)}/comments`,'POST',values);}
  if(type==='report'){await api(`/api/posts/${encodeURIComponent(form.dataset.id)}/report`,'POST',values);$('#dialog').close();toast('Denúncia registrada para revisão do operador.');}
  if(type==='message'){await api('/api/messages/'+encodeURIComponent(V.chat),'POST',values);form.reset();await loadMessages();}
  if(type==='delete-account'){await api('/api/account','DELETE',values);$('#dialog').close();V.page='feed';V.chat=null;V.messages=[];V.profile=null;await refresh();toast('Conta excluída deste banco.');}
}catch(error){if(err)err.textContent=error.message;else toast(error.message);}finally{if(button)button.disabled=false;}});
document.addEventListener('change',async e=>{if(e.target.id==='chat-target'){V.chat=e.target.value||null;V.messages=[];draw();return loadMessages();}if(e.target.id==='image-file'){V.image='';$('#image-preview').innerHTML='';const file=e.target.files[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>3*1024*1024){e.target.value='';return toast('Escolha JPEG, PNG ou WebP com até 3 MB.');}try{const reader=new FileReader();const data=await new Promise((resolve,reject)=>{reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Não foi possível ler a imagem.'));reader.readAsDataURL(file);});const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error('Imagem inválida.'));img.src=data;});if(img.naturalWidth*img.naturalHeight>16000000)throw new Error('Use uma imagem com até 16 megapixels.');V.image=data;$('#image-preview').innerHTML=`<img class="preview" src="${esc(data)}" alt="Prévia da imagem selecionada">`;}catch(error){e.target.value='';toast(error.message);}}});
setInterval(()=>{if(V.page==='messages'&&V.chat&&document.visibilityState==='visible')loadMessages();},8000);
(async()=>{try{await refresh();if(DEMO&&window.SynapseDemo.temporary)toast('Armazenamento indisponível. Os dados desta demo são temporários.');}catch(e){$('#app').innerHTML=`<main class="loading-screen"><h2>Não foi possível conectar.</h2><span>${esc(e.message)}</span><p class="tiny">Inicie o servidor e recarregue a página. A versão com contas não troca para uma demo silenciosamente.</p><button class="btn primary" data-action="refresh">Tentar novamente</button></main>`;}if(!DEMO&&'serviceWorker' in navigator&&window.isSecureContext){navigator.serviceWorker.register('/sw.js').catch(()=>{});}})();
</script>
</body></html>
