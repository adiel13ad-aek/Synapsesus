function storyStrip(){const users=[...new Set(S.stories.map(s=>s.author_id))];return `<section class="story-strip" aria-label="Stories e assuntos"><button class="story" data-action="new-story"><span class="story-add">${icon('plus')}</span><small>Seu momento</small></button>${users.map(id=>`<button class="story" data-action="story" data-id="${esc(id)}"><span class="story-ring">${avatar(A(id))}</span><small>${esc(A(id).name.split(' ')[0])}</small></button>`).join('')}${[['Design','spark'],['Fotografia','image'],['Tecnologia','globe'],['Ciência','book']].map(([t,i])=>`<button class="story" data-action="topic" data-query="${t}"><span class="topic-circle">${icon(i)}</span><small>${t}</small></button>`).join('')}</section>`;}
function postCard(p){const a=A(p.author_id),image=media(p.image_path),seed=p.source==='seed';return `<article class="post" id="post-${esc(p.id)}" data-post="${esc(p.id)}"><header class="post-head"><button data-action="profile" data-id="${esc(a.id)}" aria-label="Ver perfil de ${esc(a.name)}">${avatar(a)}</button><div><button class="post-author" data-action="profile" data-id="${esc(a.id)}">${esc(a.name)}</button><div class="post-meta">${seed?'Perfil editorial · exemplo':'@'+esc(a.handle)} · ${ago(p.created_at)}</div></div><button class="icon-btn" data-action="post-menu" data-id="${esc(p.id)}" aria-label="Opções da publicação">${icon('more')}</button></header>${image||seed?`<div class="post-media-wrap" data-double-like="${esc(p.id)}">${image?`<img class="post-media" src="${esc(image)}" alt="${esc(p.image_alt||'Imagem compartilhada por '+a.name)}" loading="lazy">`:art(p.id.includes('design')?'design':p.id.includes('science')?'science':'land')} ${seed?'<span class="image-caption">Ilustração editorial · exemplo</span>':''}</div>`:''}<div class="post-actions"><button class="action ${p.liked?'liked':''}" data-action="like" data-id="${esc(p.id)}" aria-label="Curtir" aria-pressed="${!!p.liked}">${icon('heart')}</button><button class="action" data-action="comments" data-id="${esc(p.id)}" aria-label="Comentários" aria-expanded="${V.comments.has(p.id)}">${icon('chat')}</button><button class="action" data-action="share-post" data-id="${esc(p.id)}" aria-label="Compartilhar publicação">${icon('send')}</button><span class="spacer"></span>${safeLink(p.link_url)?`<button class="action" data-action="collect" data-url="${esc(p.link_url)}" data-title="${esc(p.link_title)}" aria-label="Guardar fonte na coleção">${icon('folder')}</button>`:''}<button class="action ${S.saved.includes(p.id)?'saved':''}" data-action="save-post" data-id="${esc(p.id)}" aria-label="Salvar publicação" aria-pressed="${S.saved.includes(p.id)}">${icon('bookmark')}</button></div><div class="post-text"><p class="post-stat">${Number(p.likes)||0} ${Number(p.likes)===1?'curtida':'curtidas'}</p><p class="post-body"><b>${esc(a.handle)}</b>${bodyText(p.body)}</p>${safeLink(p.link_url)?`<a class="link-card" href="${esc(safeLink(p.link_url))}" target="_blank" rel="noopener noreferrer"><span class="link-symbol">${icon('link')}</span><span><strong>${esc(p.link_title||'Abrir a descoberta')}</strong><small>${esc(host(p.link_url))}</small></span>${icon('external')}</a>`:''}<button class="comment-toggle" data-action="comments" data-id="${esc(p.id)}">${p.comments?.length?'Ver '+p.comments.length+' comentário(s)':'Comece a conversa'}</button></div>${V.comments.has(p.id)?commentsHTML(p):''}</article>`;}
function commentsHTML(p){return `<div class="comments">${p.comments.map(c=>`<div class="comment">${avatar(A(c.author_id),'small')}<div class="comment-content"><strong>${esc(A(c.author_id).name)}</strong><p>${esc(c.body)}</p></div>${S.me?`<button class="icon-btn" data-action="${c.author_id===S.me.id||p.author_id===S.me.id?'delete-comment':'report-comment'}" data-id="${esc(c.id)}" aria-label="${c.author_id===S.me.id||p.author_id===S.me.id?'Excluir':'Denunciar'} comentário">${icon(c.author_id===S.me.id||p.author_id===S.me.id?'trash':'flag')}</button>`:''}</div>`).join('')}<form class="comment-form" data-form="comment" data-id="${esc(p.id)}"><input name="body" placeholder="Adicione um comentário…" aria-label="Seu comentário" maxlength="600" required><button class="btn primary" type="submit" aria-label="Enviar comentário">${icon('send')}</button></form></div>`;}
function feed(){let posts=S.posts;if(V.filter==='following')posts=posts.filter(p=>S.following.includes(p.author_id)||p.author_id===S.me?.id);if(V.filter==='saved')posts=posts.filter(p=>S.saved.includes(p.id));return `<section class="welcome"><div><p class="hello">UM NOVO DIA, NOVAS CONEXÕES</p><h1>O que te move hoje?</h1><p>Boas ideias ficam melhores quando a gente compartilha.</p></div><div class="welcome-art"><span class="spark" aria-hidden="true">✦</span></div></section>${storyStrip()}<div class="feed-tabs"><div class="tab-group">${[['all','Descobertas'],['following','Seguindo'],['saved','Salvos']].map(([id,t])=>`<button class="tab ${V.filter===id?'active':''}" data-action="feed-filter" data-id="${id}">${t}</button>`).join('')}</div><button class="icon-btn" data-action="refresh" aria-label="Atualizar feed">${icon('refresh')}</button></div><div class="composer-teaser">${avatar(S.me)}<button class="composer-prompt" data-action="new-post">Qual foi a sua última descoberta?</button><button class="icon-btn" data-action="new-post" aria-label="Publicar uma foto">${icon('image')}</button></div>${posts.length?posts.map(postCard).join(''):empty('O próximo post pode ser seu.','Siga pessoas, salve publicações ou compartilhe a primeira descoberta.','image','<button class="btn primary" data-action="new-post">Criar publicação</button>')}`;}
function discoveryGrid(posts){return `<div class="discovery-grid">${posts.map(p=>`<button class="discovery-card" data-action="open-post" data-id="${esc(p.id)}">${media(p.image_path)?`<img src="${esc(media(p.image_path))}" alt="${esc(p.image_alt||'Imagem da descoberta')}" loading="lazy">`:art(p.id.includes('design')?'design':p.id.includes('science')?'science':'land')}<div class="discovery-text"><strong>${esc(p.body.slice(0,90))}${p.body.length>90?'…':''}</strong><small>@${esc(A(p.author_id).handle)} ${p.source==='seed'?'· exemplo':''}</small></div></button>`).join('')}</div>`;}
function searchResults(){if(V.searching)return '<div class="skeleton-card" role="status" aria-label="Pesquisando"></div>';if(V.searchError)return `<div class="notice">${esc(V.searchError)}</div>`;if(!V.result)return '';const r=V.result;let out='';if(['web','wiki'].includes(V.scope)){out+=`<div class="external-options">${(r.shortcuts||[]).map(l=>`<a class="btn secondary" target="_blank" rel="noopener noreferrer" href="${esc(safeLink(l.url))}">${esc(l.name)} ${icon('external')}</a>`).join('')}</div>`;if(r.notice)out+=`<div class="notice">${esc(r.notice)} Nenhum resultado é inventado.</div>`;out+=(r.results||[]).map(resultCard).join('');}else{if(r.people?.length)out+=`<div class="settings-card"><div class="people-list">${r.people.map(personRow).join('')}</div></div>`;if(r.posts?.length)out+=r.posts.map(postCard).join('');if(!r.people?.length&&!r.posts?.length)out+=empty('Nada por aqui ainda.','Tente outro termo ou pesquise na aba Web.','search');}return out;}
function resultCard(r){const url=safeLink(r.url);if(!url)return '';return `<article class="result"><span class="result-domain">${esc(host(url))}${r.provider?' · '+esc(r.provider):''}</span><h3><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(r.title||url)}</a></h3><p>${esc(r.description||'Abra o site para conhecer a fonte original.')}</p><div class="result-actions"><button class="btn secondary" data-action="collect" data-url="${esc(url)}" data-title="${esc(r.title)}">${icon('folder')} Guardar</button><button class="btn secondary" data-action="share-link" data-url="${esc(url)}" data-title="${esc(r.title)}">${icon('send')} Compartilhar</button><a class="btn ghost" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Abrir ${icon('external')}</a></div></article>`;}
function explore(){const direct=safeLink(V.query);return `<section class="discover-hero"><p class="eyebrow">EXPLORE ALÉM DO FEED</p><h1>Encontre algo<br>que <em>te inspire.</em></h1><p>Uma busca. Novas referências. Infinitas conversas.</p><form class="search-large" data-form="search"><input id="explore-query" name="q" placeholder="Pesquise um assunto ou cole um endereço…" aria-label="Pesquisar ou abrir endereço" value="${esc(V.query)}" maxlength="200" required><button type="submit" class="btn primary">${icon('search')}<span>Pesquisar</span></button></form><div class="topics">${['Design','Universo','Criar jogos'].map(t=>`<button class="chip" data-action="topic" data-query="${t}">${t}</button>`).join('')}</div></section><div class="scope-tabs">${[['social','Na rede','grid'],['people','Pessoas','users'],['web','Web','globe'],['wiki','Wikipédia','book']].map(([id,t,i])=>`<button class="chip ${V.scope===id?'active':''}" data-action="scope" data-id="${id}">${icon(i)} ${t}</button>`).join('')}</div>${direct?resultCard({url:direct,title:'Abrir este endereço',description:'Navegação externa: o site abre no navegador, sem publicar sua pesquisa.'}):V.query?searchResults():`<div class="section-heading"><h3>Um pouco de inspiração</h3><span class="tiny">Publicações da rede</span></div>${discoveryGrid(S.posts)}<div class="notice">A busca social consulta as publicações deste servidor. A aba Web usa um provedor configurado ou abre o buscador escolhido. Sites externos não são incorporados nem têm proteções removidas.</div>`}`;}
function collections(){if(!S.me)return empty('Um lugar para as suas referências.','Crie uma conta para guardar links e notas privadas.','folder','<button class="btn primary" data-action="auth">Criar conta</button>');const names=[...new Set(S.links.map(l=>l.collection))];const links=V.collection==='all'?S.links:S.links.filter(l=>l.collection===V.collection);return `${pageHead('Suas coleções','Só você vê seus links e anotações.',`<button class="btn primary" data-action="collect">${icon('plus')}<span>Guardar link</span></button>`)}<div class="collections-tabs"><button class="chip ${V.collection==='all'?'active':''}" data-action="collection" data-id="all">Todas · ${S.links.length}</button>${names.map(n=>`<button class="chip ${V.collection===n?'active':''}" data-action="collection" data-id="${esc(n)}">${esc(n)} · ${S.links.filter(l=>l.collection===n).length}</button>`).join('')}</div>${links.length?links.map(l=>`<article class="result"><span class="result-domain">${icon('lock')} ${esc(l.collection)}</span><h3><a target="_blank" rel="noopener noreferrer" href="${esc(safeLink(l.url))}">${esc(l.title||host(l.url))}</a></h3><p>${esc(host(l.url))}</p>${l.note?`<div class="result-note">${esc(l.note)}</div>`:''}<div class="result-actions"><button class="btn secondary" data-action="share-link" data-url="${esc(l.url)}" data-title="${esc(l.title)}">${icon('send')} Compartilhar</button><button class="btn ghost" data-action="edit-link" data-id="${esc(l.id)}">${icon('edit')} Editar</button><button class="icon-btn" data-action="delete-link" data-id="${esc(l.id)}" aria-label="Excluir link">${icon('trash')}</button></div></article>`).join(''):empty('Sua próxima ideia começa aqui.','Pesquise, encontre uma referência e guarde com uma nota só sua.','folder','<button class="btn secondary" data-go="explore">Explorar</button>')}`;}
function profile(){const id=V.profile||S.me?.id;if(!id)return empty('Mostre o que te inspira.','Cadastre-se para personalizar seu perfil, compartilhar e seguir pessoas.','user','<button class="btn primary" data-action="auth">Criar meu perfil</button>');const a=A(id),own=id===S.me?.id,posts=S.posts.filter(p=>p.author_id===id);const cover=media(a.cover_path);return `<section class="profile-card"><div class="profile-cover">${cover?`<img src="${esc(cover)}" alt="Capa de ${esc(a.name)}">`:''}</div><div class="profile-main">${avatar(a,'large')}<div class="profile-toolbar">${own?`<button class="btn secondary" data-action="edit-profile">${icon('edit')} Editar perfil</button><button class="icon-btn" data-go="settings" aria-label="Configurações">${icon('settings')}</button>`:`<button class="btn primary" data-action="follow" data-id="${esc(id)}">${S.following.includes(id)?'Seguindo':'Seguir'}</button>${!a.seeded?`<button class="btn secondary" data-action="chat" data-id="${esc(id)}">${icon('chat')}</button>`:''}<button class="icon-btn" data-action="profile-menu" data-id="${esc(id)}" aria-label="Opções de perfil">${icon('more')}</button>`}</div><h2>${esc(a.name)}</h2><p class="profile-handle">@${esc(a.handle)}${a.seeded?' · perfil editorial fictício':''}</p><p class="profile-bio">${esc(a.bio||'Um mundo de descobertas para compartilhar.')}</p>${safeLink(a.website)?`<a class="profile-website" target="_blank" rel="noopener noreferrer" href="${esc(safeLink(a.website))}">${icon('link')} ${esc(host(a.website))}</a>`:''}<div class="profile-stats"><div><strong>${posts.length}</strong><span>No feed atual</span></div><div><strong>${a.followers||0}</strong><span>Seguidores</span></div>${own?`<div><strong>${S.following.length}</strong><span>Seguindo</span></div>`:''}</div><div class="topics">${(a.interests||[]).map(t=>`<button class="chip" data-action="topic" data-query="${esc(t)}">${esc(t)}</button>`).join('')}</div></div></section><div class="section-heading"><h3>Descobertas de ${own?'você':esc(a.name.split(' ')[0])}</h3>${icon('grid')}</div>${posts.length?discoveryGrid(posts):empty('Um perfil cheio de possibilidades.','As publicações deste perfil aparecerão aqui.','image',own?'<button class="btn primary" data-action="new-post">Compartilhar algo</button>':'')}`;}
function settings(){const p=S.preferences||{},acc=S.account;return `${pageHead('Do seu jeito.','Sua conta, sua aparência, suas escolhas.')}<section class="settings-card"><h3>Aparência</h3><p>Escolha seu tema. As preferências de conta acompanham você nos dispositivos.</p><form data-form="preferences"><div class="settings-grid"><label>Tema<select name="theme">${[['system','Seguir o dispositivo'],['light','Claro'],['dark','Escuro']].map(([v,t])=>`<option value="${v}" ${p.theme===v?'selected':''}>${t}</option>`).join('')}</select></label><label>Cor de destaque<select name="accent">${[['violet','Violeta'],['rose','Rosa'],['mint','Verde'],['blue','Azul']].map(([v,t])=>`<option value="${v}" ${p.accent===v?'selected':''}>${t}</option>`).join('')}</select></label></div><label class="check-label"><input type="checkbox" name="reduce_motion" ${p.reduce_motion?'checked':''}><span>Reduzir animações e movimentos.</span></label><label>Quem pode me enviar mensagens?<select name="dm_policy">${[['everyone','Pessoas da rede'],['following','Somente pessoas que eu sigo'],['off','Ninguém']].map(([v,t])=>`<option value="${v}" ${p.dm_policy===v?'selected':''}>${t}</option>`).join('')}</select></label>${errorLine}<div class="dialog-footer"><button class="btn primary" type="submit">Salvar preferências</button></div></form></section>${S.me?`<section class="settings-card"><h3>Conta e segurança</h3><p>Usuário: @${esc(S.me.handle)}</p><div class="settings-row"><div><strong>E-mail ${acc?.email_verified?'confirmado':'não confirmado'}</strong><small>${esc(acc?.email||'Modo demonstração / conta antiga sem e-mail')}</small></div>${!acc?.email_verified&&!DEMO?'<button class="btn secondary" data-action="resend">Confirmar e-mail</button>':''}</div>${!DEMO?`<p class="tiny">${S.mail_mode==='file'?'Modo de teste: e-mails são gravados em data/outbox no servidor. Nada é enviado à sua caixa de entrada.':S.mail_mode==='smtp'?'Envio SMTP configurado; a entrega depende do provedor.':'Envio de e-mails desativado pelo operador.'}</p>`:''}<div class="settings-row"><div><strong>Senha</strong><small>Trocar a senha encerra as sessões abertas.</small></div><button class="btn secondary" data-action="password">Alterar senha</button></div><div class="settings-row"><div><strong>Seus dados</strong><small>Baixe uma cópia em JSON.</small></div><button class="btn secondary" data-action="export">${icon('download')} Exportar</button></div><div class="settings-row"><div><strong>Contas bloqueadas</strong><small>${S.blocked.length} perfil(is)</small></div><button class="btn secondary" data-action="blocked">Gerenciar</button></div><div class="settings-row"><button class="btn ghost" data-action="logout">${icon('logout')} Sair da conta</button><button class="btn danger" data-action="delete-account">${icon('trash')} ${DEMO?'Redefinir demo':'Excluir conta'}</button></div></section>`:`<section class="settings-card"><p>Entre para salvar suas preferências na conta.</p><button class="btn primary" data-action="auth">Entrar</button></section>`}<section class="settings-card"><h3>Transparência</h3><p>Beta privado. Não há criptografia de ponta a ponta, anúncios ou agentes de IA nesta entrega. As buscas externas obedecem às políticas dos provedores.</p><div class="topics">${[['privacy','Privacidade'],['terms','Termos'],['safety','Segurança'],['about','Sobre']].map(([id,t])=>`<button class="chip" data-action="legal" data-id="${id}">${t}</button>`).join('')}</div>${installPrompt?'<div class="dialog-footer"><button class="btn primary" data-action="install">Instalar aplicativo</button></div>':''}${S.is_admin?'<div class="dialog-footer"><button class="btn secondary" data-go="moderation">Abrir moderação</button></div>':''}</section>`;}
function notifications(){if(!S.me)return empty('Suas conexões, em um só lugar.','Entre para acompanhar curtidas, comentários e mensagens.','bell','<button class="btn primary" data-action="auth">Entrar</button>');const labels={like:'curtiu sua publicação.',comment:'comentou em uma publicação sua.',follow:'começou a seguir você.',message:'enviou uma mensagem.'};return `${pageHead('Acontecendo por aqui.','Notificações dentro do aplicativo, sem notificações push.',`<button class="btn secondary" data-action="read-notifications">${icon('check')}<span>Marcar como lidas</span></button>`)}${S.notifications.length?`<div class="notification-list">${S.notifications.map(n=>`<div class="notification ${n.seen?'':'unread'}">${avatar(A(n.actor_id))}<div class="notification-content"><p><b>${esc(A(n.actor_id).name)}</b> ${labels[n.kind]||'interagiu com você.'}</p><small>${ago(n.created_at)}</small></div><button class="icon-btn" data-action="${n.kind==='message'?'chat':'profile'}" data-id="${esc(n.actor_id)}" aria-label="Abrir interação">${icon(n.kind==='message'?'chat':n.kind==='like'?'heart':'user')}</button></div>`).join('')}</div>`:empty('Ainda está tranquilo por aqui.','Quando alguém interagir com você, a atividade aparecerá nesta tela.','bell')}`;}
function messageBubbles(){return V.messages.length?V.messages.map(m=>`<div class="bubble ${m.sender_id===S.me?.id?'own':''}">${esc(m.body)}<small>${ago(m.created_at)}${m.sender_id!==S.me?.id?` · <button class="report-message" data-action="report-message" data-id="${esc(m.id)}">Denunciar</button>`:''}</small></div>`).join(''):'<div class="empty"><h3>A conversa começa com um oi.</h3><p>Envie uma mensagem. Apenas participantes têm acesso pela aplicação; não há criptografia de ponta a ponta.</p></div>';}
function messages(){if(!S.me)return empty('Converse sobre suas descobertas.','Entre na conta para enviar mensagens.','chat','<button class="btn primary" data-action="auth">Entrar</button>');const people=S.actors.filter(a=>!a.seeded&&a.id!==S.me.id&&!S.blocked.includes(a.id));return `${pageHead('Conversas','Uma boa descoberta merece uma boa conversa.')}<section class="chat-shell"><div class="chat-head">${avatar(V.chat?A(V.chat):S.me)}<label class="full"><span class="tiny">Conversar com</span><select id="chat-target" aria-label="Escolha uma pessoa"><option value="">Selecione uma pessoa</option>${people.map(a=>`<option value="${esc(a.id)}" ${V.chat===a.id?'selected':''}>${esc(a.name)} · @${esc(a.handle)}</option>`).join('')}</select></label></div><div class="chat-messages" id="chat-messages">${V.chat?messageBubbles():empty(people.length?'Escolha uma conversa.':'Convide a primeira pessoa.',DEMO?'Na demo, mensagens não são enviadas a pessoas reais.':'Para testar, crie outra conta no mesmo servidor usando outro navegador.','users')}</div><div class="chat-warning">Mensagens sem criptografia de ponta a ponta. Não envie informações sensíveis neste beta.</div>${V.chat?`<form class="message-form" data-form="message"><input name="body" placeholder="Escreva uma mensagem…" aria-label="Sua mensagem" maxlength="1500" required><button class="btn primary" type="submit" aria-label="Enviar mensagem">${icon('send')}</button></form>`:''}</section>`;}
function moderationPage(){if(!S.is_admin)return empty('Área do operador.','O servidor precisa autorizar seu usuário antes de mostrar esta área.','shield');return `${pageHead('Central de moderação','Revisão humana de denúncias. Nenhuma aprovação é automática.')}<div id="moderation-results"><div class="skeleton-card"></div></div>`;}
async function loadModeration(){if(!S.is_admin)return;try{const data=await api('/api/admin/reports');const box=$('#moderation-results');if(!box)return;box.innerHTML=data.reports.length?data.reports.map(r=>`<article class="result"><span class="result-domain">${esc(r.kind)} · ${esc(r.status)} · ${ago(r.created_at)}</span><h3>${esc(r.reason)}</h3><p>${esc(r.content||'[conteúdo removido]')}</p>${r.status==='open'?`<div class="result-actions"><button class="btn secondary" data-action="moderate" data-id="${esc(r.id)}" data-kind="dismiss">Descartar denúncia</button><button class="btn danger" data-action="moderate" data-id="${esc(r.id)}" data-kind="remove">${r.kind==='profile'?'Suspender conta':'Remover conteúdo'}</button></div>`:''}</article>`).join(''):empty('Fila vazia.','Nenhuma denúncia registrada neste servidor.','shield');}catch(e){toast(e.message);}}
function draw(){const pages={feed,explore,collections,profile,settings,notifications,messages,moderation:moderationPage};$('#app').innerHTML=shell((pages[V.page]||feed)());if(V.page==='moderation')loadModeration();}
function go(page){if(page==='profile')V.profile=null;V.page=page;draw();window.scrollTo({top:0});if(page==='messages'&&V.chat)loadMessages();}
function authDialog(mode='register'){if(DEMO)return dialog('Esta é uma demonstração.',`<p class="dialog-note">O arquivo HTML não cria contas reais. Abra o projeto com servidor para testar cadastro, login, confirmação de e-mail e recuperação de senha. Não informe uma senha real na demonstração.</p><button class="btn primary full" data-action="close">Continuar explorando</button>`);V.auth=mode;const reg=mode==='register';dialog(reg?'Seu mundo começa aqui.':'Que bom ter você de volta.',`<div class="auth-art">${icon('spark')}<strong>Descobertas que conectam.</strong></div><form data-form="auth"><div class="form-grid">${reg?'<label>Seu nome<input name="name" autocomplete="name" placeholder="Como você gosta de ser chamado?" minlength="2" maxlength="50" required></label>':''}<label>${reg?'Nome de usuário':'Usuário ou e-mail'}<input name="handle" autocomplete="username" placeholder="${reg?'seu.nome':'@usuário ou seu e-mail'}" ${reg?'pattern="[a-zA-Z0-9_.]{3,24}" minlength="3" maxlength="24"':'maxlength="254"'} required></label>${reg?'<label>E-mail<input name="email" type="email" autocomplete="email" placeholder="voce@exemplo.com" maxlength="254" required><small>Usado para confirmar a conta e recuperar o acesso.</small></label>':''}<label>Senha<input name="password" type="password" autocomplete="${reg?'new-password':'current-password'}" ${reg?'minlength="10"':''} maxlength="128" required>${reg?'<span class="password-hint">Use pelo menos 10 caracteres. Evite senhas reutilizadas.</span>':''}</label>${reg?'<label class="check-label"><input name="terms_accepted" type="checkbox" required><span>Li e aceito os <a href="/terms.html" target="_blank" rel="noopener noreferrer">Termos</a> e a <a href="/privacy.html" target="_blank" rel="noopener noreferrer">Política de privacidade</a> deste beta privado.</span></label>':'<button class="text-link" data-action="forgot" type="button">Esqueci minha senha</button>'}</div>${errorLine}<div class="dialog-footer"><button class="btn primary full" type="submit">${reg?'Criar minha conta':'Entrar'} ${icon('arrow')}</button></div></form><p class="auth-switch">${reg?'Já faz parte?':'Ainda não tem conta?'} <button data-action="auth-mode" data-id="${reg?'login':'register'}">${reg?'Entrar':'Criar conta'}</button></p>`,reg?'Publique ideias. Encontre pessoas. Siga sua curiosidade.':'Entre para continuar suas descobertas.');}
function compose(url='',title='',editId=''){if(!requireAccount())return;const post=editId?S.posts.find(p=>p.id===editId):null;V.image='';dialog(post?'Ajuste sua publicação.':'Compartilhe uma descoberta.',`<form data-form="${post?'edit-post':'post'}" data-id="${esc(editId)}"><div class="form-grid"><label>Legenda<textarea name="body" rows="4" maxlength="2000" placeholder="O que você encontrou de interessante?" required>${esc(post?.body||'')}</textarea></label>${post?'':`<div class="upload-area"><label>Uma foto<input id="image-file" type="file" accept="image/jpeg,image/png,image/webp" data-upload="image"></label><p>JPEG, PNG ou WebP · até 3 MB · até 16 megapixels</p><div id="image-preview"></div></div>`}<label>Descrição da imagem para acessibilidade<input name="image_alt" maxlength="250" value="${esc(post?.image_alt||'')}" placeholder="Descreva o que aparece na imagem"></label>${post?'':`<label>Link da descoberta (opcional)<input name="link_url" type="url" value="${esc(url)}" maxlength="2048" placeholder="https://"></label><label>Título do link<input name="link_title" maxlength="180" value="${esc(title)}" placeholder="Uma referência que vale a pena"></label>`}</div>${errorLine}<div class="dialog-footer"><button type="button" class="btn ghost" data-action="close">Cancelar</button><button type="submit" class="btn primary">${icon(post?'check':'send')} ${post?'Salvar alterações':'Publicar'}</button></div></form>`,'Seu post fica público neste servidor. Coleções e notas privadas não são incluídas.');}
function collect(url='',title='',collection='Favoritos',note=''){if(!requireAccount())return;dialog('Guarde para depois.',`<form data-form="collect"><div class="form-grid"><label>Endereço<input name="url" type="url" value="${esc(url)}" maxlength="2048" placeholder="https://" required></label><label>Título<input name="title" value="${esc(title)}" maxlength="180" required></label><label>Coleção<input name="collection" value="${esc(collection)}" maxlength="40" list="collection-names" required><datalist id="collection-names">${[...new Set(S.links.map(l=>l.collection))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist></label><label>Sua nota privada<textarea name="note" maxlength="1000" rows="3" placeholder="Por que essa referência é interessante?">${esc(note)}</textarea></label></div>${errorLine}<div class="dialog-footer"><button type="submit" class="btn primary">${icon('lock')} Guardar na coleção</button></div></form>`,'Só a sua conta vê estas anotações. Nada será publicado automaticamente.');}
function editProfile(){if(!requireAccount())return;V.avatar='';V.cover='';dialog('Um perfil com a sua cara.',`<form data-form="profile"><div class="form-grid"><div class="form-row"><label>Foto do perfil<input type="file" accept="image/jpeg,image/png,image/webp" data-upload="avatar"><small>Até 3 MB. Metadados são removidos no servidor.</small><span id="avatar-preview"></span></label><label>Capa do perfil<input type="file" accept="image/jpeg,image/png,image/webp" data-upload="cover"><small>Imagens horizontais funcionam melhor.</small><span id="cover-preview"></span></label></div><div class="form-row"><label class="check-label"><input type="checkbox" name="remove_avatar">Remover foto atual</label><label class="check-label"><input type="checkbox" name="remove_cover">Remover capa atual</label></div><label>Seu nome<input name="name" value="${esc(S.me.name)}" minlength="2" maxlength="50" required></label><label>Bio<textarea name="bio" rows="3" maxlength="300" placeholder="O que faz seus olhos brilharem?">${esc(S.me.bio)}</textarea></label><label>Seu site<input name="website" type="url" maxlength="2048" value="${esc(S.me.website)}" placeholder="https://"></label><label>Interesses<input name="interests" value="${esc((S.me.interests||[]).join(', '))}" maxlength="248" placeholder="Tecnologia, fotografia, ciência"><small>Até 8 interesses separados por vírgula.</small></label><label>Cor do avatar<select name="color">${['violet','blue','mint','rose','amber'].map((v,i)=>`<option value="${v}" ${S.me.color===v?'selected':''}>${['Violeta','Azul','Verde','Rosa','Dourado'][i]}</option>`).join('')}</select></label></div>${errorLine}<div class="dialog-footer"><button type="submit" class="btn primary">${icon('check')} Salvar perfil</button></div></form>`);}
function reportDialog(kind,id){if(!requireAccount())return;dialog('Ajude a cuidar da comunidade.',`<form data-form="report" data-kind="${esc(kind)}" data-id="${esc(id)}"><label>Por que você está denunciando?<textarea name="reason" minlength="3" maxlength="500" placeholder="Descreva o problema sem repetir conteúdo sensível." required></textarea></label><p class="dialog-note">A denúncia vai para a fila do operador. O beta não tem moderação automática nem atendimento de emergência.</p>${errorLine}<div class="dialog-footer"><button class="btn primary" type="submit">${icon('flag')} Enviar denúncia</button></div></form>`);}
function postMenu(id){const p=S.posts.find(p=>p.id===id)||V.result?.posts?.find(p=>p.id===id);if(!p)return;const own=p.author_id===S.me?.id;dialog('Esta publicação',`<div class="menu-actions">${own?`<button class="btn secondary" data-action="edit-post" data-id="${esc(id)}">${icon('edit')} Editar legenda</button><button class="btn danger" data-action="delete-post" data-id="${esc(id)}">${icon('trash')} Excluir publicação</button>`:`<button class="btn secondary" data-action="report-post" data-id="${esc(id)}">${icon('flag')} Denunciar publicação</button><button class="btn ghost" data-action="block" data-id="${esc(p.author_id)}">${icon('shield')} Bloquear perfil</button>`}<button class="btn secondary" data-action="share-post" data-id="${esc(id)}">${icon('link')} Compartilhar link</button></div>`);}
function createStory(){if(!requireAccount())return;V.image='';dialog('Seu momento de agora.',`<form data-form="story"><div class="form-grid"><label>O que está acontecendo?<textarea name="body" maxlength="280" required placeholder="Uma ideia, uma foto, um pequeno momento…"></textarea></label><label>Foto opcional<input type="file" accept="image/jpeg,image/png,image/webp" data-upload="image"></label><div id="image-preview"></div><label>Fundo<select name="color">${['violet','rose','mint','blue','amber'].map((v,i)=>`<option value="${v}">${['Violeta','Rosa','Verde','Azul','Dourado'][i]}</option>`).join('')}</select></label></div>${errorLine}<div class="dialog-footer"><button type="submit" class="btn primary">Publicar story ${icon('arrow')}</button></div></form>`,'Stories saem da lista pública após 24 horas. Não existe contagem de visualizações nesta versão.');}
function showStory(index){clearTimeout(storyTimer);if(!S.stories.length)return;V.storyIndex=(index+S.stories.length)%S.stories.length;const s=S.stories[V.storyIndex],a=A(s.author_id);V.storyPaused=false;V.storyRemaining=8000;dialog('Momentos',`<section class="story-view ${esc(s.color)}">${media(s.image_path)?`<img src="${esc(media(s.image_path))}" alt="Imagem do story">`:''}<div class="stack"><div class="story-progress"><span></span></div><div class="person-row">${avatar(a)}<div class="person-info"><strong>${esc(a.name)}</strong><small>${ago(s.created_at)} · expira em 24 h</small></div></div></div><h3>${esc(s.body)}</h3><div class="tiny">${V.storyIndex+1} / ${S.stories.length}</div></section><div class="story-controls"><button class="btn secondary" data-action="previous-story" aria-label="Story anterior">${icon('back')}</button><button class="btn secondary" data-action="pause-story" aria-label="Pausar story">${icon('pause')}</button><button class="btn secondary" data-action="next-story" aria-label="Próximo story">${icon('arrow')}</button><button class="btn ghost" data-action="${s.author_id===S.me?.id?'delete-story':'report-story'}" data-id="${esc(s.id)}" aria-label="${s.author_id===S.me?.id?'Excluir':'Denunciar'} story">${icon(s.author_id===S.me?.id?'trash':'flag')}</button></div>`);V.storyDeadline=Date.now()+8000;storyTimer=setTimeout(nextStory,8000);}
function nextStory(){if(V.storyIndex+1>=S.stories.length)closeDialog();else showStory(V.storyIndex+1);}
function legal(kind){const content={about:['Feito para a sua curiosidade.','Synapse Discovery 0.4 é um beta de rede social com pesquisa e coleções privadas. Não tem agentes de IA, vídeos, chamadas ou notificações push. Perfis editoriais e capas vetoriais são exemplos identificados.'],privacy:['Privacidade no beta','O servidor guarda nome, usuário, e-mail, hash da senha, perfil, fotos, posts, comentários, mensagens e coleções. Posts e perfis são públicos. Coleções são privadas pela aplicação. Mensagens não têm criptografia de ponta a ponta. Imagens são reencodificadas para remover metadados. O arquivo de exportação inclui dados da conta. A exclusão remove os registros ativos associados; cópias e backups do operador precisam de política própria. Pesquisas externas vão para os provedores escolhidos. Não há SDK de anúncios ou rastreadores no código entregue.'],terms:['Termos do beta privado','Use somente em testes com pessoas autorizadas e dados não sensíveis. Você é responsável pelo conteúdo que publica e deve ter os direitos necessários. São proibidos exploração ou abuso sexual infantil, ameaças, assédio, divulgação não autorizada de dados privados e conteúdo ilegal. Denúncias podem levar à remoção do conteúdo ou suspensão da conta. Este texto é um rascunho: o operador precisa informar identidade, contato e condições revisadas antes de qualquer lançamento público.'],safety:['Uma comunidade exige cuidado.','Denuncie posts, comentários, stories, mensagens ou perfis pelas opções de cada conteúdo. Bloqueie perfis indesejados e limite quem pode enviar mensagens em Configurações. A fila é revisada manualmente pelo operador autorizado. Exploração e abuso sexual infantil são proibidos. Antes do lançamento público, é obrigatório definir um responsável, um canal de segurança, procedimento de resposta e políticas revisadas. Este beta não dispõe de equipe de plantão.']};const c=content[kind]||content.about;dialog(c[0],`<div class="legal-content"><p>${esc(c[1])}</p><h3>Excluir ou exportar a conta</h3><p>Entre em Configurações para exportar seus dados ou excluir a conta com a senha. A página pública de instruções está em /delete-account.html no seu servidor.</p><p>Antes de publicar, substitua os rascunhos pelos documentos reais da operação.</p></div>`);}
async function search(q=V.query){const ticket=++searchTicket;V.query=q.trim().slice(0,200);V.page='explore';V.result=null;V.searchError='';V.searching=!!V.query&&!safeLink(V.query);draw();if(!V.query||safeLink(V.query))return;try{const r=await api('/api/search?'+new URLSearchParams({q:V.query,scope:V.scope}));if(ticket===searchTicket)V.result=r;}catch(e){if(ticket===searchTicket)V.searchError=e.message;}finally{if(ticket===searchTicket){V.searching=false;if(V.page==='explore')draw();}}}
async function loadMessages(){const target=V.chat;if(!target||!S.me)return;const ticket=++chatTicket;try{const r=await api('/api/messages/'+encodeURIComponent(target));if(ticket!==chatTicket||target!==V.chat)return;const changed=JSON.stringify(r.messages)!==JSON.stringify(V.messages);V.messages=r.messages;const box=$('#chat-messages');if(box&&changed){box.innerHTML=messageBubbles();box.scrollTop=box.scrollHeight;}}catch(e){toast(e.message);}}
async function update(path,method='POST',data={}){if(!requireAccount())return;const scroll=window.scrollY;await api(path,method,data);await refresh(false);if(V.page==='explore'&&['social','people'].includes(V.scope)&&V.query)await search();else draw();window.scrollTo({top:scroll});}
async function sharePost(id){const p=S.posts.find(p=>p.id===id);if(!p)return;const url=DEMO?'':location.origin+'/?post='+encodeURIComponent(id);const text=p.body+(url?'\n'+url:'');try{if(navigator.share&&url){await navigator.share({title:'Uma descoberta no Synapse',text:p.body,url});return;}if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);toast('Link e legenda copiados.');return;}}catch(e){if(e.name==='AbortError')return;}dialog('Compartilhar descoberta',`<label>Copie o texto e o link<textarea rows="6" readonly>${esc(text)}</textarea></label><p class="dialog-note">${DEMO?'Publicações da demo só existem neste dispositivo.':'O link só funciona para quem consegue acessar este servidor.'}</p>`);}
function passwordDialog(){if(DEMO)return toast('Troca de senha exige a versão com servidor.');dialog('Uma nova senha.',`<form data-form="password"><div class="form-grid"><label>Senha atual<input name="current_password" type="password" autocomplete="current-password" required></label><label>Nova senha<input name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label></div>${errorLine}<p class="dialog-note">Todas as sessões serão encerradas após a alteração.</p><div class="dialog-footer"><button type="submit" class="btn primary">Alterar senha</button></div></form>`);}
async function action(el){const a=el.dataset.action,id=el.dataset.id;
 if(a==='close')return closeDialog();if(a==='auth')return authDialog();if(a==='auth-mode')return authDialog(id);
 if(a==='new-post')return compose();if(a==='edit-post')return compose('','',id);if(a==='new-story')return createStory();if(a==='edit-profile')return editProfile();
 if(a==='collect')return collect(el.dataset.url||'',el.dataset.title||'');if(a==='share-link')return compose(el.dataset.url,el.dataset.title);
 if(a==='edit-link'){const l=S.links.find(l=>l.id===id);if(l)return collect(l.url,l.title,l.collection,l.note);}
 if(a==='feed-filter'){V.filter=id;return draw();}if(a==='collection'){V.collection=id;return draw();}
 if(a==='topic')return search(el.dataset.query);if(a==='scope'){V.scope=id;return search();}if(a==='people'){V.scope='people';V.query='';go('explore');V.result={people:S.actors.filter(a=>a.id!==S.me?.id&&!S.blocked.includes(a.id)),posts:[]};V.query=' ';return draw();}
 if(a==='profile'){V.profile=id;V.page='profile';draw();window.scrollTo({top:0});return;}
 if(a==='comments'){V.comments.has(id)?V.comments.delete(id):V.comments.add(id);const y=window.scrollY;draw();window.scrollTo({top:y});return;}
 if(a==='post-menu')return postMenu(id);if(a==='share-post')return sharePost(id);
 if(a==='open-post'){V.page='feed';V.filter='all';draw();$('#post-'+id)?.scrollIntoView({block:'start'});return;}
 if(a==='story')return showStory(S.stories.findIndex(s=>s.author_id===id));if(a==='next-story')return nextStory();if(a==='previous-story')return showStory(V.storyIndex-1);
 if(a==='pause-story'){V.storyPaused=!V.storyPaused;clearTimeout(storyTimer);$('.story-view')?.classList.toggle('story-paused',V.storyPaused);if(V.storyPaused)V.storyRemaining=Math.max(1,V.storyDeadline-Date.now());else{V.storyDeadline=Date.now()+V.storyRemaining;storyTimer=setTimeout(nextStory,V.storyRemaining);}el.innerHTML=icon(V.storyPaused?'play':'pause');el.setAttribute('aria-label',V.storyPaused?'Continuar story':'Pausar story');return;}
 if(a==='legal')return legal(id);if(a==='password')return passwordDialog();
 if(a==='forgot')return dialog('Vamos recuperar seu acesso.',`<form data-form="forgot"><label>E-mail da conta<input type="email" name="email" autocomplete="email" maxlength="254" required></label>${errorLine}<p class="dialog-note">O envio depende do serviço configurado pelo operador. Em testes locais, as mensagens ficam em data/outbox.</p><div class="dialog-footer"><button class="btn primary" type="submit">Enviar instruções</button></div></form>`);
 if(a==='profile-menu')return dialog('Este perfil',`<div class="menu-actions"><button class="btn secondary" data-action="report-profile" data-id="${esc(id)}">${icon('flag')} Denunciar perfil</button><button class="btn danger" data-action="block" data-id="${esc(id)}">${icon('shield')} ${S.blocked.includes(id)?'Desbloquear':'Bloquear'} perfil</button></div>`);
 if(a.startsWith('report-'))return reportDialog(a.slice(7),id);
 if(a==='refresh'){await refresh();return toast('Feed atualizado.');}
 if(a==='chat'){if(!requireAccount())return;V.chat=id;V.messages=[];V.page='messages';draw();return loadMessages();}
 if(a==='install'&&installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;return;}
 if(!requireAccount())return;
 if(a==='logout'){await api('/api/auth/logout','POST',{});V.chat=null;V.messages=[];V.profile=null;V.page='feed';return refresh();}
 if(a==='like')return update(`/api/posts/${encodeURIComponent(id)}/like`);if(a==='save-post')return update(`/api/posts/${encodeURIComponent(id)}/save`);if(a==='follow')return update(`/api/actors/${encodeURIComponent(id)}/follow`);
 if(a==='block'){await update(`/api/actors/${encodeURIComponent(id)}/block`);closeDialog();V.profile=null;V.chat=null;V.page='feed';draw();toast('Preferência de bloqueio atualizada.');return;}
 if(a==='delete-link'){if(!confirm('Remover este link da coleção?'))return;await update('/api/links/'+encodeURIComponent(id),'DELETE');return toast('Referência removida.');}
 if(a==='delete-post'){if(!confirm('Excluir esta publicação? Esta ação não pode ser desfeita.'))return;await update('/api/posts/'+encodeURIComponent(id),'DELETE');closeDialog();return toast('Publicação excluída.');}
 if(a==='delete-comment'){if(!confirm('Excluir este comentário?'))return;return update('/api/comments/'+encodeURIComponent(id),'DELETE');}
 if(a==='delete-story'){if(!confirm('Excluir seu story?'))return;await update('/api/stories/'+encodeURIComponent(id),'DELETE');closeDialog();return;}
 if(a==='read-notifications'){await update('/api/notifications/read');return toast('Atividade marcada como lida.');}
 if(a==='resend'){await api('/api/auth/resend-verification','POST',{});return toast(S.mail_mode==='file'?'Mensagem de teste gravada em data/outbox no servidor.':'Solicitação registrada. Confira seu e-mail ou contate o operador.');}
 if(a==='blocked')return dialog('Contas bloqueadas',S.blocked.length?`<div class="people-list">${S.blocked.map(id=>`<div class="person-row">${avatar(A(id))}<span class="person-info">${esc(A(id).name)}</span><button class="btn secondary" data-action="block" data-id="${esc(id)}">Desbloquear</button></div>`).join('')}</div>`:'<p class="dialog-note">Nenhuma conta bloqueada.</p>');
 if(a==='export'){if(!DEMO&&navigator.userAgent.includes('SynapseAndroid/')){location.assign('/api/account/export');return;}const data=await api('/api/account/export');const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const file=new File([blob],'synapse-meus-dados.json',{type:'application/json'});if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:'Meus dados Synapse'});return;}catch(e){if(e.name==='AbortError')return;}}const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='synapse-meus-dados.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return;}
 if(a==='delete-account'){if(DEMO)return dialog('Redefinir a demonstração?',`<p class="dialog-note">Isso apaga suas alterações locais, não afeta contas em servidores.</p><button class="btn danger full" data-action="reset-demo">Redefinir demo</button>`);return dialog('Excluir minha conta',`<form data-form="delete-account"><p class="dialog-note">A conta, posts, comentários, mensagens e coleções serão removidos do banco ativo. A ação é irreversível. Cópias feitas por outras pessoas e backups do operador não são controlados por este botão.</p><label>Confirme sua senha<input name="password" type="password" autocomplete="current-password" required></label>${errorLine}<div class="dialog-footer"><button class="btn danger" type="submit">Excluir definitivamente</button></div></form>`);}
 if(a==='reset-demo'){window.SynapseDemo.reset();closeDialog();V.page='feed';V.collection='all';return refresh();}
 if(a==='moderate'){if(el.dataset.kind==='remove'&&!confirm('Confirmar remoção ou suspensão do conteúdo denunciado?'))return;await api('/api/admin/reports/'+encodeURIComponent(id),'POST',{action:el.dataset.kind});await refresh(false);await loadModeration();toast('Denúncia revisada.');}
}
document.addEventListener('click',async e=>{const goEl=e.target.closest('[data-go]');if(goEl){e.preventDefault();return go(goEl.dataset.go);}const el=e.target.closest('[data-action]');if(!el)return;e.preventDefault();if(el.disabled)return;el.disabled=true;try{await action(el);}catch(error){toast(error.message||'Não foi possível concluir.');}finally{el.disabled=false;}});
document.addEventListener('submit',async e=>{const form=e.target.closest('[data-form]');if(!form)return;e.preventDefault();const type=form.dataset.form;const values=Object.fromEntries(new FormData(form));if(type==='search')return search(values.q);if(!['auth','forgot','reset','verify'].includes(type)&&!requireAccount())return;const button=$('[type="submit"]',form);if(button?.disabled)return;if(button)button.disabled=true;const err=$('.form-error',form);if(err)err.textContent='';try{
 if(type==='auth'){if(V.auth==='register')values.terms_accepted=values.terms_accepted==='on';const r=await api('/api/auth/'+V.auth,'POST',values);S.csrf=r.csrf;closeDialog();await refresh();toast('Bem-vindo ao Synapse!');if(V.auth==='register')editProfile();}
 if(type==='post'){await api('/api/posts','POST',{...values,image_data:V.image});closeDialog();V.page='feed';V.filter='all';await refresh();toast('Sua descoberta está no feed.');}
 if(type==='edit-post'){await api('/api/posts/'+encodeURIComponent(form.dataset.id),'PATCH',values);closeDialog();await refresh();toast('Publicação atualizada.');}
 if(type==='collect'){await api('/api/links','POST',values);closeDialog();await refresh();toast('Guardado só para você.');}
 if(type==='profile'){values.interests=values.interests.split(',').map(s=>s.trim()).filter(Boolean);values.avatar_data=V.avatar;values.cover_data=V.cover;values.remove_avatar=values.remove_avatar==='on';values.remove_cover=values.remove_cover==='on';await api('/api/profile','PATCH',values);closeDialog();await refresh();toast('Agora o perfil está com a sua cara.');}
 if(type==='preferences'){values.reduce_motion=values.reduce_motion==='on';await api('/api/preferences','PATCH',values);await refresh();toast('Suas preferências foram salvas.');}
 if(type==='comment')await update('/api/posts/'+encodeURIComponent(form.dataset.id)+'/comments','POST',values);
 if(type==='report'){const kind=form.dataset.kind,id=form.dataset.id;await api(kind==='post'?'/api/posts/'+encodeURIComponent(id)+'/report':'/api/reports','POST',kind==='post'?values:{...values,kind,target_id:id});closeDialog();toast('Denúncia registrada para revisão humana.');}
 if(type==='message'){await api('/api/messages/'+encodeURIComponent(V.chat),'POST',values);form.reset();await loadMessages();}
 if(type==='story'){await api('/api/stories','POST',{...values,image_data:V.image});closeDialog();V.page='feed';await refresh();toast('Seu momento está no ar por 24 horas.');}
 if(type==='delete-account'){await api('/api/account','DELETE',values);closeDialog();V.page='feed';V.chat=null;V.profile=null;V.messages=[];await refresh();toast('Sua conta foi excluída do banco ativo.');}
 if(type==='password'){await api('/api/account/password','PATCH',values);closeDialog();await refresh();authDialog('login');toast('Senha alterada. Entre novamente.');}
 if(type==='forgot'){const r=await api('/api/auth/forgot','POST',values);closeDialog();dialog('Confira as instruções.',`<p class="dialog-note">${esc(r.message)}</p><p class="dialog-note">Em modo local, o operador deve consultar data/outbox. O endereço não é confirmado pela resposta.</p>`);}
 if(type==='reset'){await api('/api/auth/reset','POST',{...values,token:form.dataset.token});closeDialog();history.replaceState(null,'',location.pathname);await refresh();authDialog('login');toast('Senha redefinida. Entre com a nova senha.');}
 if(type==='verify'){await api('/api/auth/verify','POST',{token:form.dataset.token});closeDialog();history.replaceState(null,'',location.pathname);await refresh();toast('E-mail confirmado.');}
}catch(error){if(err)err.textContent=error.message;else toast(error.message);}finally{if(button)button.disabled=false;}});
document.addEventListener('change',async e=>{if(e.target.id==='chat-target'){V.chat=e.target.value||null;V.messages=[];draw();return loadMessages();}const kind=e.target.dataset.upload;if(!kind)return;V[kind]='';const preview=$('#'+kind+'-preview');if(preview)preview.innerHTML='';const file=e.target.files[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>3*1024*1024){e.target.value='';return toast('Escolha JPEG, PNG ou WebP com até 3 MB.');}try{const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Não foi possível ler a imagem.'));reader.readAsDataURL(file);});const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error('Imagem inválida.'));img.src=data;});if(img.naturalWidth*img.naturalHeight>16000000)throw new Error('Use uma imagem de até 16 megapixels.');V[kind]=data;if(preview)preview.innerHTML=`<img class="preview" src="${esc(data)}" alt="Prévia da imagem selecionada">`;}catch(error){e.target.value='';toast(error.message);}});
document.addEventListener('dblclick',async e=>{const box=e.target.closest('[data-double-like]');if(!box||!requireAccount())return;const id=box.dataset.doubleLike,p=S.posts.find(p=>p.id===id);if(!p)return;box.insertAdjacentHTML('beforeend','<span class="heart-burst" aria-hidden="true">♥</span>');setTimeout(()=>box.querySelector('.heart-burst')?.remove(),800);if(!p.liked){try{await api('/api/posts/'+encodeURIComponent(id)+'/like','POST',{});await refresh(false);setTimeout(draw,650);}catch(e){toast(e.message);}}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)&&!$('#dialog').open){e.preventDefault();const input=$('.topbar-search input');if(input&&getComputedStyle($('.topbar-search')).display!=='none')input.focus();else{go('explore');$('#explore-query')?.focus();}}});
$('#dialog').addEventListener('close',()=>clearTimeout(storyTimer));
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyPreferences);
setInterval(()=>{if(V.page==='messages'&&V.chat&&document.visibilityState==='visible'&&!$('#dialog').open)loadMessages();},8000);
(async()=>{try{await refresh();const qs=new URLSearchParams(location.search);if(qs.has('post')){V.page='feed';draw();$('#post-'+qs.get('post'))?.scrollIntoView({block:'start'});}if(qs.has('profile')){const a=S.actors.find(a=>a.handle===qs.get('profile'));if(a){V.profile=a.id;V.page='profile';draw();}}if(qs.has('settings'))go('settings');for(const kind of ['verify','reset'])if(qs.has(kind)&&!DEMO){const token=qs.get(kind);dialog(kind==='verify'?'Confirmar seu e-mail':'Recuperar sua conta',`<form data-form="${kind}" data-token="${esc(token)}">${kind==='reset'?'<label>Nova senha<input name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label>':'<p class="dialog-note">Confirme que este endereço de e-mail pertence a você.</p>'}${errorLine}<div class="dialog-footer"><button class="btn primary" type="submit">${kind==='reset'?'Definir nova senha':'Confirmar e-mail'}</button></div></form>`);}if(DEMO&&window.SynapseDemo.temporary)toast('Armazenamento indisponível. A demo funciona somente nesta sessão.');}catch(e){$('#app').innerHTML=`<main class="loading-screen"><div class="brand-mark">s</div><h2>Vamos reconectar?</h2><p>${esc(e.message)}</p><p>Inicie o servidor e recarregue. A rede não troca para uma demo silenciosamente.</p><button class="btn primary" data-action="refresh">Tentar novamente</button></main>`;}if(!DEMO&&'serviceWorker'in navigator&&window.isSecureContext)navigator.serviceWorker.register('/sw.js').catch(()=>{});})();
// Invoked only by the fixed-origin Android shell. This is not a native JavaScript bridge.
window.synapseBack=()=>{if($('#dialog').open){closeDialog();return true;}if(V.page!=='feed'){go('feed');return true;}return false;};
</script></body></html>
